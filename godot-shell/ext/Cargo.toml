[package]
name = "livi-godot-shell"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace: native/'s pins a beta toolchain and builds LIVI's whole tree.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
godot = { version = "0.5.5", features = ["api-4-7"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
livi-core-client = { path = "../../native/crates/livi-core-client" }
livi-core-proto = { path = "../../native/crates/livi-core-proto" }
livi-ui-model = { path = "../../native/crates/livi-ui-model" }
serde_json = "1.0.154"
serde_norway = "0.9.42"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# The settings portal (portal.rs), on zbus's own runtime: the shell has no async one.
zbus = { version = "6.2.1", default-features = false, features = ["default-rt", "service"] }

# Projection video as the stock macOS frontend shows it: a native view under the window (wayland_stub.rs).
[target.'cfg(target_os = "macos")'.dependencies]
livi-video-view = { path = "../../native/crates/livi-video-view" }
