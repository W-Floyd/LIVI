# Settings for /usr/bin/livi-shell and the services. Plain shell, sourced by the launcher;
# the systemd units read it as an EnvironmentFile too, so keep to KEY=value lines.

# The shell's own Wayland socket, in XDG_RUNTIME_DIR: livi-gst-host draws video into it.
LIVI_SHELL_SOCKET=livi-shell

# A left-edge menu to jump between pages (home, EV, phone), until the shell has real navigation.
LIVI_SHELL_NAV=1

# The panel. The device's kernel gives the connector's native mode, 1920x720.
LIVI_SHELL_RESOLUTION=1920x720

# Where the DRM device is, if cage picks the wrong one (the unit has the display controller
# and, if the kernel has a driver for it, the GPU).
#WLR_DRM_DEVICES=/dev/dri/card0
# Software GL, for finding out whether the GPU driver is the problem.
#WLR_RENDERER=pixman
#LIBGL_ALWAYS_SOFTWARE=1

# More arguments for Godot, e.g. --verbose or --print-fps.
#LIVI_SHELL_GODOT_ARGS=--print-fps

# Themes (a vendor pack is the owner's, built locally from their own unit; never packaged).
#LIVI_SHELL_THEMES=/var/lib/livi-shell/themes
