name: app-keyboard-gtk
# A real toolkit's field: GTK 4's entry asks through zwp_text_input_v3 with its purpose (email:
# the "@" key), takes the letters as commits and backspace and Done as keys. Needs python3 and
# GTK 4's introspection (py3-gobject3, gtk4.0) in the VM.
clock: 2026-11-09T08:30:00
nav: true
fixtures:
  core: fixtures/parked.json
steps:
  - wait: { frames: 2 }
  - gdscript: |
      var log: String = runner._client_events("org.livi.test.gtk")
      DirAccess.make_dir_recursive_absolute(log.get_base_dir())
      runner.set_meta("log", log)
      return runner._spawn({role = "command", run = ["python3", ProjectSettings.globalize_path("res://../tests/fixtures/clients/gtk-entry.py"), log]})
  - wait: { window: org.livi.test.gtk }
  - page: app
  - wait: { frames: 30 }
  # The entry is the window's first row.
  - gdscript: |
      await runner._touch(Vector2(shell.get_global_rect().position.x + 100.0, 15.0))
      for i in 120:
          if shell.app_keyboard != null:
              break
          await runner.frames(1)
      if shell.app_keyboard == null:
          return "no keyboard for GTK's entry"
      if shell.app_keyboard.keyboard.key("@") == null or shell.app_keyboard.keyboard.key("_") == null:
          return "no email keys"
      await runner.frames(30)
  - screenshot: { name: app-keyboard-gtk, compare: false }
  - tap: { node: AppKeyboard/Keyboard/Keys/h }
  - tap: { node: AppKeyboard/Keyboard/Keys/i }
  - tap: { node: AppKeyboard/Keyboard/Keys/U0040 }
  - tap: { node: AppKeyboard/Keyboard/Keys/Backspace }
  - tap: { node: AppKeyboard/Keyboard/Keys/Done }
  - gdscript: |
      for i in 120:
          var got := FileAccess.get_file_as_string(runner.get_meta("log"))
          if got.contains("activate hi"):
              return ""
          await runner.frames(1)
      return "GTK got %s" % JSON.stringify(FileAccess.get_file_as_string(runner.get_meta("log")).split("\n", false))
