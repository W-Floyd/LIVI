name: app-popup
# An app's menu: a tap opens the test client's grabbing popup (bars, 160×96) below and right of
# it, drawn over the window, which shows all around it; shm, and dmabufs drawn by the GPU. Leaving
# the app page closes it; so does a tap outside it, which the window never gets.
clock: 2026-11-09T08:30:00
fixtures:
  core: fixtures/parked.json
  clients:
    - { role: app, app_id: org.livi.test.popup, size: 640x360, events: true, popup: true }
    - { role: app, app_id: org.livi.test.popupdma, size: 640x360, events: true, popup: true, buffer: dmabuf }
steps:
  - wait: { window: org.livi.test.popup }
  - wait: { window: org.livi.test.popupdma }
  - gdscript: |
      # On screen, as drawn (a GPU scene's texture reads back empty): the window is 640×360,
      # letterboxed in the view.
      runner.set_meta("check", func(id: String, open: bool) -> String:
          var got := ""
          for i in 60:
              var w = Wayland.find_window(id)
              var view: Control = shell.get_node("Projection/Window")
              var rect := view.get_global_rect()
              var k := minf(rect.size.x / 640.0, rect.size.y / 360.0)
              var at0 := rect.position + (rect.size - Vector2(640, 360) * k) / 2.0
              var img: Image = runner._vp.get_texture().get_image()
              # Mid cells, away from edges the view filters: the menu, left of it, top left, bottom right.
              var want := [[Vector2(401, 229), Color8(255, 0, 255) if open else Color8(200, 200, 200)], [Vector2(300, 229), Color8(200, 200, 200)], [Vector2(10, 10), Color8(220, 40, 40)], [Vector2(620, 340), Color8(60, 60, 60)]]
              got = "" if Wayland.texture(w).get_size() == Vector2(640, 360) else "%s is %s; " % [id, Wayland.texture(w).get_size()]
              for p in want:
                  var c := img.get_pixelv(Vector2i(at0 + (p[0] + Vector2(0.5, 0.5)) * k))
                  if c.to_rgba32() != p[1].to_rgba32():
                      got += "%s at %s: %s, want %s; " % [id, p[0], c, p[1]]
              if got == "":
                  return ""
              await runner.frames(1)
          return got)
  - gdscript: shell.bring_forward(Wayland.find_window("org.livi.test.popup"))
  - page: app
  - tap: { node: Projection/Window, with: touch }
  - expect_client: { app_id: org.livi.test.popup, lines: ["touch down 0 320.0 180.0", "popup configure 321 181 160 96"] }
  - gdscript: return await runner.get_meta("check").call("org.livi.test.popup", true)
  - screenshot: { name: app-popup, compare: false }
  - page: home
  - expect_client: { app_id: org.livi.test.popup, lines: ["popup configure 321 181 160 96", "popup done"] }
  - page: app
  - tap: { node: Projection/Window, with: touch }
  - expect_client: { app_id: org.livi.test.popup, lines: ["popup done", "touch down 0 320.0 180.0", "popup configure 321 181 160 96"] }
  - gdscript: return await runner.get_meta("check").call("org.livi.test.popup", true)
  # The window's centre is just outside the menu.
  - tap: { node: Projection/Window, with: touch }
  - expect_client: { app_id: org.livi.test.popup, lines: ["popup done", "touch down 0 320.0 180.0", "popup configure 321 181 160 96", "popup done"] }
  - gdscript: |
      var bad = await runner.get_meta("check").call("org.livi.test.popup", false)
      if bad != "":
          return bad
      var downs := Array(FileAccess.get_file_as_string(runner._client_events("org.livi.test.popup")).split("\n", false)).filter(func(l): return l.begins_with("touch down"))
      if downs.size() != 2:
          return "the window got %s" % [downs]
  # Dmabufs: the window and its menu are scene layers, both drawn.
  - gdscript: shell.bring_forward(Wayland.find_window("org.livi.test.popupdma"))
  - wait: { frames: 2 }
  - tap: { node: Projection/Window, with: touch }
  - expect_client: { app_id: org.livi.test.popupdma, lines: ["touch down 0 320.0 180.0", "popup configure 321 181 160 96"] }
  - gdscript: return await runner.get_meta("check").call("org.livi.test.popupdma", true)
  - screenshot: { name: app-popup-dmabuf, compare: false }
  - tap: { node: Projection/Window, with: touch }
  - expect_client: { app_id: org.livi.test.popupdma, lines: ["popup configure 321 181 160 96", "popup done"] }
  - gdscript: return await runner.get_meta("check").call("org.livi.test.popupdma", false)
