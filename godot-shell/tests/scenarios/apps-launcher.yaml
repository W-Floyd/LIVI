name: apps-launcher
# The launcher lists the fixture's desktop entries and apps.yaml (tests/fixtures/apps); a tap
# starts an app on the shell's compositor and opens the app page on its window. The running
# strip brings a window forward and closes it; a running app's tile shows its window instead of
# starting another; a launch that fails is reported on its tile.
clock: 2026-11-09T08:30:00
fixtures:
  core: fixtures/parked.json
  apps: fixtures/apps
steps:
  - theme: { appearance: day }
  - page: apps
  - gdscript: |
      var ids = shell.launcher.apps.map(func(a): return a.id)
      var want = ["org.livi.test.grid", "livi-broken", "org.livi.test.bars", "org.livi.test.extra", "zeta"]
      if ids != want:
          return "apps %s, want %s" % [ids, want]
  - expect_node: { path: Apps/Scroll/List/Grid/zeta/Name, text: Zeta renamed }
  - screenshot: apps-day
  # Matched by app_id, the desktop file ID.
  - tap: { node: Apps/Scroll/List/Grid/org_livi_test_grid }
  - wait: { window: org.livi.test.grid }
  - wait: { frames: 2 }
  - gdscript: &front_grid |
      var w = Wayland.find_window("org.livi.test.grid")
      if shell._page_name != "app" or shell._projection.window.window_id != w:
          return "page %s shows %d, want app showing %d" % [shell._page_name, shell._projection.window.window_id, w]
  # Matched by StartupWMClass.
  - page: apps
  - tap: { node: Apps/Scroll/List/Grid/org_livi_test_bars }
  - wait: { window: bars-window }
  - wait: { frames: 2 }
  - gdscript: |
      var w = Wayland.find_window("bars-window")
      if shell._page_name != "app" or shell._projection.window.window_id != w:
          return "page %s shows %d, want app showing %d" % [shell._page_name, shell._projection.window.window_id, w]
      if shell.launcher.state("org.livi.test.bars") != "running":
          return "bars is %s" % shell.launcher.state("org.livi.test.bars")
  - page: apps
  - screenshot: apps-running
  # The switcher brings Grid forward.
  - tap: { node: Apps/Running/org_livi_test_grid }
  - wait: { frames: 2 }
  - gdscript: *front_grid
  # A running app's tile shows its window: no second instance.
  - page: apps
  - tap: { node: Apps/Scroll/List/Grid/org_livi_test_grid }
  - wait: { frames: 2 }
  - gdscript: |
      if Wayland.window_count() != 2:
          return "%d windows" % Wayland.window_count()
  - gdscript: *front_grid
  # Close from the switcher: xdg_toplevel.close, which the client obeys.
  - page: apps
  - tap: { node: Apps/Running/org_livi_test_grid/Close }
  - gdscript: |
      var until = Time.get_ticks_msec() + 5000
      while Wayland.find_window("org.livi.test.grid") >= 0 and Time.get_ticks_msec() < until:
          await runner.frames(1)
      if Wayland.find_window("org.livi.test.grid") >= 0:
          return "grid did not close"
      await runner.frames(2)
      var names = shell.launcher.running().map(func(r): return r.name)
      if names != ["Colour bars"]:
          return "running %s" % names
  # Exits at once with status 1.
  - tap: { node: Apps/Scroll/List/Grid/livi-broken }
  - gdscript: |
      var until = Time.get_ticks_msec() + 5000
      while shell.launcher.state("livi-broken") != "failed" and Time.get_ticks_msec() < until:
          await runner.frames(1)
      if shell.launcher.state("livi-broken") != "failed":
          return "broken is %s" % shell.launcher.state("livi-broken")
      await runner.frames(2)
  - expect_node: { path: Apps/Scroll/List/Grid/livi-broken/Name, text: "Couldn't start" }
  - theme: { appearance: night }
  - screenshot: apps-night
  # The grid in the page's rect at every bar edge, hand and text scale, rail or none: even
  # columns filling its width, room for two whole rows and part of a third (the running strip
  # shown; fewer at a large text scale), tiles at least a touch target and names their own two
  # lines.
  - gdscript: |
      for docked in [false, true]:
          if docked:
              NavRail.attach(shell)
          for pos in ["top", "bottom", "left", "right", "off"]:
              for hand in ["lhd", "rhd"]:
                  for scale in [1.0, 1.4]:
                      ThemeManager.set_look({status_position = pos, hand = hand, text_scale = scale})
                      var e: String = shell.open_page("apps")
                      if e != "":
                          return e
                      await runner.frames(3)
                      var at := "rail %s, %s, %s, %s: " % [docked, pos, hand, scale]
                      var page: Control = shell.get_node("Apps")
                      var scroll: Control = page.get_node("Scroll")
                      var grid: GridContainer = page.get_node("Scroll/List/Grid")
                      var sep := AppsPage.gutter()
                      var cell: Vector2 = grid.get_child(0).size
                      for t in grid.get_children():
                          if t.size != cell:
                              return at + "%s is %s, %s is %s" % [grid.get_child(0).name, cell, t.name, t.size]
                          var n: Label = t.get_node("Name")
                          if n.get_visible_line_count() < mini(n.get_line_count(), 2) or not Rect2(Vector2.ZERO, t.size).encloses(n.get_rect()) or not Rect2(Vector2.ZERO, t.size).encloses(t.get_node("Icon").get_rect()):
                              return at + "%s's name or icon runs out of it" % t.name
                      var used := cell.x * grid.columns + sep * (grid.columns - 1)
                      if used > scroll.size.x or scroll.size.x - used >= grid.columns:
                          return at + "%d columns of %s fill %s of %s" % [grid.columns, cell, used, scroll.size.x]
                      if absf((scroll.position.x) - (page.size.x - scroll.position.x - scroll.size.x)) > 0.5:
                          return at + "the grid at %s, off centre in %s" % [scroll.get_rect(), page.size]
                      var rows := (scroll.size.y + sep) / (cell.y + sep)
                      if mini(cell.x, cell.y) < ThemeManager.px.touch or rows < (2.2 if scale == 1.0 else 1.5) or (scale == 1.0 and rows > 2.9):
                          return at + "tiles %s, %.2f rows in %s" % [cell, rows, scroll.size]
