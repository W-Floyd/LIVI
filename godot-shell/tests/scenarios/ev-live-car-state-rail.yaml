name: ev-live-car-state-rail
# Beside a docked rail the EV page has no back button: the car's state takes its place in the
# title row on the car's side, as many items as fit there (what is open as a count before an item
# goes), and leaves the scene's room to the charge and ranges at any text scale.
clock: 2026-11-09T19:05:00
nav: true
fixtures:
  core: fixtures/charging.json
theme: { theme_name: instrument, appearance: night, reduced_motion: true }
steps:
  - set: { core: { telemetry: { climate: {} } } }
  - set: { core: { telemetry: { charging: false, chargePortOpen: false, doorDriverOpen: true, trunkOpen: true, auxBatteryPct: 24, climatePowerW: 1400, batteryHeaterW: 2100, climate: { source: car, fanLevel: 2, on: true } } } }
  - page: ev_live
  - expect_node: { path: EvLive/TitleBar/Back, visible: "false" }
  - gdscript: &row |
      # In the title row, clear of the title's text, on the car's side; nothing placed overlaps.
      var page: Control = shell.get_node("EvLive")
      var s: Control = page.get_node("CarStatus")
      var bar: Rect2 = page.get_node("TitleBar").get_global_rect()
      var r := s.get_global_rect()
      if not s.visible or r.position.y < bar.position.y or r.end.y > bar.end.y:
          return "the car's state %s is not in the title row %s" % [r, bar]
      var t: Label = page.get_node("Title")
      var tw: float = t.get_theme_font("font").get_string_size(t.text, HORIZONTAL_ALIGNMENT_LEFT, -1, t.get_theme_font_size("font_size")).x
      var tx: float = t.get_global_rect().get_center().x
      if r.end.x > tx - tw / 2.0 and r.position.x < tx + tw / 2.0:
          return "the car's state %s overlaps the title" % r
      if (ThemeManager.hand == "rhd") != (r.get_center().x > page.get_global_rect().get_center().x):
          return "the car's state %s is not on the car's side" % r
      if not page.get_node("CarStatus/Row0/Body").visible:
          return "what is open was dropped"
      var rects := []
      for p in ["CarStatus", "Battery", "RangeOn", "RangeOff", "ChargerLabel", "next_departure", "scheduled", "v2l", "Settings"]:
          var n: Control = page.get_node(p)
          if n.visible:
              rects.append([p, n.get_global_rect()])
      for i in rects.size():
          for j in range(i + 1, rects.size()):
              # The charger's label against the ranges is the scene's layout, not this.
              var names := [rects[i][0], rects[j][0]]
              var mine := names.any(func(n): return n.ends_with("CarStatus") or n.ends_with("ChargeCard") or n.ends_with("Battery")) \
                  or (names.has("RangeOn") and names.has("RangeOff"))
              if mine and rects[i][1].intersects(rects[j][1]):
                  return "%s overlaps %s: %s %s" % [rects[i][0], rects[j][0], rects[i][1], rects[j][1]]
  - screenshot: ev-live-car-state-rail
  - theme: { text_scale: 1.4 }
  - wait: { frames: 2 }
  - gdscript: *row
  - screenshot: ev-live-car-state-rail-text-1.4
  - theme: { text_scale: 1.0, hand: rhd }
  - wait: { frames: 2 }
  - gdscript: *row
  - screenshot: { name: ev-live-car-state-rail-rhd, compare: false }
  # The targets fit their text and stay short: no taller than a title and a detail line
  # (EvTile.height()), every label inside its tile, trimmed with an ellipsis if at all, never cut
  # off, at small and large text, every bar edge and both drive sides, beside the rail; with the
  # car's live schedules (2026-11-12) and a V2L limit.
  - set: { core: { telemetry: { departure1: {}, departure2: {} } } }
  - set: { core: { telemetry: { departure1: { on: false, hour: 12, minute: 0, days: [false, false, false, false, false, false, false] }, departure2: { on: false, hour: 12, minute: 0, days: [false, false, false, false, false, false, false] }, scheduledChargingMode: "off", scheduledClimate: false, v2lDischargeLimitPct: 20 } } }
  - gdscript: |
      for ts in [1.0, 1.4]:
          for pos in ["top", "bottom", "left", "right", "off"]:
              for hand in ["lhd", "rhd"]:
                  ThemeManager.set_look({text_scale = ts, status_position = pos, hand = hand})
                  shell.open_page("ev_live")
                  await runner.frames(3)
                  for id in ["next_departure", "scheduled", "v2l", "Settings"]:
                      var tile: Control = shell.get_node("EvLive/" + id)
                      var box := tile.get_global_rect().grow(0.5)
                      if tile.size.y > EvTile.height() + 0.5:
                          return "%s, %s, %s: %s is %s tall, over %s" % [ts, pos, hand, id, tile.size.y, EvTile.height()]
                      for l in tile.find_children("*", "Label", true, false):
                          if not l.is_visible_in_tree() or l.text == "":
                              continue
                          var at := "%s, %s, %s: %s %s \"%s\"" % [ts, pos, hand, id, l.name, l.text]
                          if not box.encloses(l.get_global_rect()):
                              return "%s is outside its tile: %s %s" % [at, l.get_global_rect(), box]
                          var w: float = l.get_theme_font("font").get_string_size(l.text, HORIZONTAL_ALIGNMENT_LEFT, -1, l.get_theme_font_size("font_size")).x
                          # Trimmed with an ellipsis is said; cut off is not.
                          if l.text_overrun_behavior == TextServer.OVERRUN_TRIM_ELLIPSIS:
                              continue
                          if l.autowrap_mode == TextServer.AUTOWRAP_OFF and w > l.size.x + 1.0:
                              return "%s is cut off: %s wide in %s" % [at, w, l.size.x]
                          if l.autowrap_mode != TextServer.AUTOWRAP_OFF and l.get_line_count() > l.get_visible_line_count():
                              return "%s needs %s lines, shows %s" % [at, l.get_line_count(), l.get_visible_line_count()]
      ThemeManager.set_look({text_scale = 1.0, status_position = "top", hand = "lhd"})
  - screenshot: { name: ev-live-tiles-rail, compare: false }
  - theme: { text_scale: 1.4 }
  - wait: { frames: 2 }
  - screenshot: { name: ev-live-tiles-rail-text-1.4, compare: false }
