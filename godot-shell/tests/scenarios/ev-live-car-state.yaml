name: ev-live-car-state
# The EV page shows the car's own state from micom-livi: while charging, a card with the time to
# full and the AC and DC limits, ranges at them and estimates; what is open, on a picture of the
# car and in words; the 12 V battery; the climate and battery heater while they draw. Each only
# once the car reports it.
clock: 2026-11-09T19:05:00
fixtures:
  core: fixtures/charging.json
theme: { theme_name: instrument, appearance: day, reduced_motion: true }
steps:
  - page: ev_live
  - expect_node: { path: EvLive/ChargeCard, visible: "true" }
  - expect_node: { path: EvLive/ChargeCard/Box/Head/Title, text: Charging }
  - expect_node: { path: EvLive/ChargeCard/Box/Head/Big/ToFull, text: 1 h 25 min }
  - expect_node: { path: EvLive/ChargeCard/Box/Facts/LimitAC, text: 90 % }
  - expect_node: { path: EvLive/ChargeCard/Box/Facts/LimitDC, text: 80 % }
  - expect_node: { path: EvLive/ChargeCard/Box/Facts/RangeAC, text: 431 km }
  - expect_node: { path: EvLive/ChargeCard/Box/Facts/RangeDC, text: 383 km }
  - expect_node: { path: EvLive/ChargeCard/Box/Facts/TimeAC, text: 7 h 10 min }
  - expect_node: { path: EvLive/ChargeCard/Box/Facts/TimeDC, text: 38 min }
  - expect_node: { path: EvLive/CarStatus/Row0/Aux/Label, text: 12 V 87 % }
  # The charge port alone is open: said, not a warning.
  - expect_node: { path: EvLive/CarStatus/Row0/Body/Open, text: Charge port open }
  - gdscript: &apart |
      # Nothing the page places overlaps another, the tap targets included.
      var rects := []
      for p in ["EvLive/ChargeCard", "EvLive/CarStatus", "EvLive/Battery", "EvLive/RangeOn", "EvLive/RangeOff", "EvLive/ChargerLabel",
              "EvLive/next_departure", "EvLive/scheduled", "EvLive/v2l", "EvLive/Settings"]:
          var n: Control = shell.get_node(p)
          if n.visible:
              rects.append([p, n.get_global_rect()])
      for i in rects.size():
          for j in range(i + 1, rects.size()):
              # The charger's label against the ranges is the scene's layout, not this.
              var names := [rects[i][0], rects[j][0]]
              var mine := names.any(func(n): return n.ends_with("CarStatus") or n.ends_with("ChargeCard") or n.ends_with("Battery")) \
                  or (names.has("EvLive/RangeOn") and names.has("EvLive/RangeOff"))
              if mine and rects[i][1].intersects(rects[j][1]):
                  return "%s overlaps %s" % [rects[i][0], rects[j][0]]
  - screenshot: ev-live-charging
  # Only what the car reports: no DC limit, a dash.
  - set: { core: { telemetry: { chargeLimitDcPct: null, chargeTimeAcMin: null, chargeTimeDcMin: null } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/ChargeCard/Box/Facts/LimitDC, text: – }
  - gdscript: |
      if shell.has_node("EvLive/ChargeCard/Box/Facts/TimeAC"):
          return "a row the car does not report"
  - set: { core: { telemetry: { chargeLimitDcPct: 80, chargeTimeAcMin: 430, chargeTimeDcMin: 38 } } }
  # Not charging, the charger ready: no card. chargerReady is the on-board charger's ready
  # (OBC_SYSRDYSTA), 1 with no plug in too.
  - set: { core: { telemetry: { charging: false } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/ChargeCard, visible: "false" }
  # Unplugged: no card. Doors open, a low 12 V battery, the climate (its blower, as the range's
  # name has it) and the battery heater on. A set goes leaf by leaf: the climate object first.
  - set: { core: { telemetry: { climate: {} } } }
  - set: { core: { telemetry: { climate: { source: car, fanLevel: 2, on: true }, chargerReady: false, chargePortOpen: false, doorDriverOpen: true, trunkOpen: true, auxBatteryPct: 24, climatePowerW: 1400, batteryHeaterW: 2100 } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/ChargeCard, visible: "false" }
  - expect_node: { path: EvLive/CarStatus/Row0/Body/Open, text: Driver's door and trunk open }
  - expect_node: { path: EvLive/CarStatus/Row1/Climate/Label, text: Climate 1.4 kW }
  - expect_node: { path: EvLive/CarStatus/Row1/Heater/Label, text: Battery heater 2.1 kW }
  - gdscript: |
      var open: Label = shell.get_node("EvLive/CarStatus/Row0/Body/Open")
      var aux: Label = shell.get_node("EvLive/CarStatus/Row0/Aux/Label")
      if open.get_theme_color("font_color") != ThemeManager.c.warn or aux.get_theme_color("font_color") != ThemeManager.c.warn:
          return "open doors and a low 12 V battery are not in the warning color"
  - gdscript: *apart
  - theme: { appearance: night, hand: rhd }
  - wait: { frames: 2 }
  - gdscript: |
      var s: Control = shell.get_node("EvLive/CarStatus")
      if s.get_global_rect().end.x < 1800:
          return "RHD: the car's state is not on the car's side: %s" % s.get_global_rect()
  - gdscript: *apart
  - screenshot: ev-live-doors-night-rhd
  # Larger text: the least important items give way rather than push the charge onto the targets.
  - theme: { text_scale: 1.2 }
  - wait: { frames: 2 }
  - gdscript: *apart
  - theme: { text_scale: 1.4 }
  - wait: { frames: 2 }
  - gdscript: *apart
  - expect_node: { path: EvLive/CarStatus/Row0/Body, visible: "true" }
  - screenshot: { name: ev-live-doors-night-rhd-text-1.4, compare: false }
  - theme: { text_scale: 1.0 }
  # More than two: a count, the picture says which.
  - set: { core: { telemetry: { doorPassengerOpen: true, hoodOpen: true } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/CarStatus/Row0/Body/Open, text: 4 open }
  # Charging again, at night: the card.
  - set: { core: { telemetry: { doorDriverOpen: false, trunkOpen: false, doorPassengerOpen: false, hoodOpen: false, charging: true, chargerReady: true, chargePortOpen: true, climatePowerW: 0, batteryHeaterW: 0, auxBatteryPct: 88, climate: { fanLevel: 0, on: false } } } }
  - theme: { hand: lhd }
  - wait: { frames: 2 }
  - gdscript: *apart
  - screenshot: ev-live-charging-night
  - theme: { text_scale: 1.4 }
  - wait: { frames: 2 }
  - gdscript: *apart
  - theme: { text_scale: 1.0 }
  # Nothing reported: neither shows (the drive fixtures' pages are unchanged).
  - set: { core: { telemetry: { charging: null, chargerReady: null, chargePortOpen: null, auxBatteryPct: null, climatePowerW: null, batteryHeaterW: null } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/ChargeCard, visible: "false" }
  - expect_node: { path: EvLive/CarStatus, visible: "false" }
  # The car's battery conditioning: its mode, running, why it would not (a warning).
  - set: { core: { telemetry: { batteryConditioningMode: "off" } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/CarStatus/Row1/Conditioning/Label, text: Conditioning off }
  - set: { core: { telemetry: { batteryConditioningMode: "on", batteryConditioning: true } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/CarStatus/Row1/Conditioning/Label, text: Conditioning battery }
  - set: { core: { telemetry: { batteryConditioning: false, batteryConditioningError: 1 } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/CarStatus/Row1/Conditioning/Label, text: "Conditioning: range too short" }
  - gdscript: |
      var l: Label = shell.get_node("EvLive/CarStatus/Row1/Conditioning/Label")
      if l.get_theme_color("font_color") != ThemeManager.c.warn:
          return "why the car would not condition is not in the warning color"
  - gdscript: *apart
  - set: { core: { telemetry: { batteryConditioning: null, batteryConditioningMode: null, batteryConditioningError: null } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/CarStatus, visible: "false" }
