name: ev-live-taps
# Taps on the live page's targets say which was tapped (`ev_action`) and open the EV settings
# over the page at their section; its back button closes them.
fixtures:
  core: fixtures/ev6-main.json
theme: { theme_name: calm, appearance: day }
steps:
  - page: ev_live
  - gdscript: |
      shell.set_meta("taps", [])
      shell.ev_action.connect(func(id): shell.get_meta("taps").append(id))
  - tap: { node: EvLive/next_departure }
  - expect_node: { path: EvLive/EvSettings, visible: "true", section: schedule }
  - tap: { node: EvLive/EvSettings/Back }
  - expect_node: { path: EvLive/EvSettings, visible: "false" }
  - tap: { node: EvLive/scheduled, with: touch }
  - expect_node: { path: EvLive/EvSettings, visible: "true", section: schedule }
  - tap: { node: EvLive/EvSettings/Back, with: touch }
  - tap: { node: EvLive/v2l }
  - expect_node: { path: EvLive/EvSettings, visible: "true", section: power }
  - tap: { node: EvLive/EvSettings/Back }
  - tap: { node: EvLive/Settings, with: touch }
  - expect_node: { path: EvLive/EvSettings, visible: "true", section: charging }
  - tap: { node: EvLive/EvSettings/Back }
  - gdscript: |
      var taps: Array = shell.get_meta("taps")
      if taps != ["next_departure", "scheduled", "v2l", "settings"]:
          return "taps were %s" % [taps]
  # The targets say what the car reports: the next departure that is on (its two timers, Monday
  # first), "None set" when it reports both off, nothing until it says; scheduled charging and
  # the climate at departure, on or off.
  - gdscript: |
      var at := func(s: String) -> float: return Time.get_unix_time_from_datetime_string(s)
      var none := [false, false, false, false, false, false, false]
      var off := {on = false, hour = 12, minute = 0, days = none}
      var wk := {on = true, hour = 7, minute = 30, days = [true, true, true, true, true, false, false]}
      var monday := "2026-11-09T19:05:00"
      for c in [
          [{}, monday, ""],
          [{departure1 = off, departure2 = off}, monday, "None set"],
          [{departure1 = off, departure2 = {on = null, hour = 12, minute = 0, days = none}}, monday, ""],
          [{departure1 = wk, departure2 = off}, monday, "Tomorrow 07:30"],
          [{departure1 = wk, departure2 = off}, "2026-11-13T08:00:00", "Mon 07:30"],
          [{departure1 = {on = true, hour = 20, minute = 0, days = [true, false, false, false, false, false, false]}}, monday, "Today 20:00"],
          [{departure1 = {on = true, hour = 19, minute = 5, days = [true, false, false, false, false, false, false]}}, monday, "Mon 19:05"],
          [{departure1 = {on = true, hour = 8, minute = 0, days = none}, departure2 = {on = true, hour = 21, minute = 0, days = []}}, monday, "Today 21:00"],
      ]:
          var got: String = EvLive.next_departure(c[0], at.call(c[1]))
          if got != c[2]:
              return "%s at %s: %s, want %s" % [c[0], c[1], got, c[2]]
  - gdscript: &tile_items |
      var got := []
      for id in ["next_departure", "scheduled"]:
          for l in shell.get_node("EvLive/" + id).find_children("*", "Label", true, false):
              if l.has_meta("item"):
                  got.append(l.text)
      shell.set_meta("tile_items", got)
  - gdscript: |
      if shell.get_meta("tile_items") != ["Not available", "–", "–"]:
          return "before the car reports: %s" % [shell.get_meta("tile_items")]
  - set: { core: { telemetry: { departure1: {}, departure2: {} } } }
  - set: { core: { telemetry: { departure1: { on: false, hour: 12, minute: 0, days: [false, false, false, false, false, false, false] }, departure2: { on: false, hour: 12, minute: 0, days: [false, false, false, false, false, false, false] }, scheduledChargingMode: "off", scheduledClimate: false } } }
  - wait: { frames: 2 }
  - gdscript: *tile_items
  - gdscript: |
      if shell.get_meta("tile_items") != ["None set", "Off", "Off"]:
          return "the car's live schedules, none set: %s" % [shell.get_meta("tile_items")]
  - set: { core: { telemetry: { departure1: { on: true, hour: 7, minute: 30, days: [true, true, true, true, true, false, false] }, scheduledChargingMode: "off_peak_only", scheduledClimate: true } } }
  - wait: { frames: 2 }
  - gdscript: *tile_items
  - gdscript: |
      # The scenario's clock is a Thursday, 08:00.
      if shell.get_meta("tile_items") != ["Tomorrow 07:30", "On", "On"]:
          return "departure 1 weekdays at 07:30: %s" % [shell.get_meta("tile_items")]
  - set: { core: { telemetry: { departure1: null, departure2: null, scheduledChargingMode: null, scheduledClimate: null } } }
  - wait: { frames: 2 }
  # Pressed shows while the finger is down: the accent fill and its foreground.
  - gdscript: |
      var tile: EvTile = shell.get_node("EvLive/v2l")
      tile.button_down.emit()
      await runner.frames(2)
      var held: Color = tile.find_child("Title", true, false).get_theme_color("font_color")
      tile.button_up.emit()
      await runner.frames(2)
      var rest: Color = tile.find_child("Title", true, false).get_theme_color("font_color")
      if held != ThemeManager.c.on_accent or rest != ThemeManager.c.text:
          return "pressed foreground is %s then %s" % [held, rest]
  # A tap outside every target does nothing.
  - tap: { x: 960, y: 300 }
  - gdscript: |
      if shell.get_meta("taps").size() != 4:
          return "a tap on the scene was taken as a target"
  # The EV settings show the car's values where the car link reports them, read only where LIVI
  # has no path to set them, unavailable where it has neither (docs/ev-settings.md); LIVI's battery
  # conditioning request and its route setting work.
  - set: { core: { telemetry: { chargeLimitAcPct: 90, chargeLimitDcPct: 100 } } }
  - tap: { node: EvLive/Settings }
  - expect_node: { path: EvLive/EvSettings/Rows/List/charge_limit_ac/Lines/Line/Stepper/Value, text: 90 % }
  - expect_node: { path: EvLive/EvSettings/Rows/List/charge_limit_ac/Lines/Line/Stepper/Plus, disabled: true }
  - expect_node: { path: EvLive/EvSettings/Rows/List/charge_limit_ac/Lines/Line/Text/Detail, text: "Read only: LIVI cannot set this on the car yet" }
  - expect_node: { path: EvLive/EvSettings/Rows/List/charge_limit_dc/Lines/Line/Stepper/Value, text: 100 % }
  - expect_node: { path: EvLive/EvSettings/Rows/List/ac_current/Lines/Line/Text/Detail, text: "Not available: LIVI cannot read or set this yet" }
  - expect_node: { path: EvLive/EvSettings/Rows/List/ac_current/Lines/Line/Choice/max, disabled: true }
  - screenshot: ev-settings-charging
  - tap: { node: EvLive/EvSettings/Sections/List/schedule }
  - expect_node: { path: EvLive/EvSettings/Rows/List/departure_1/Lines/Line/Switch, disabled: true }
  - expect_node: { path: EvLive/EvSettings/Rows/List/departure_1/Lines/Days/Sat, disabled: true }
  - expect_node: { path: EvLive/EvSettings/Rows/List/off_peak/Lines/Below/Start/Hour/Plus, disabled: true }
  - expect_node: { path: EvLive/EvSettings/Rows/List/departure_1/Lines/Line/Text/Detail, text: "Not reported by the car yet" }
  - screenshot: ev-settings-schedule
  - tap: { node: EvLive/EvSettings/Sections/List/battery }
  - tap: { node: EvLive/EvSettings/Rows/List/battery_conditioning/Lines/Line/Switch }
  - expect_action: { PreconditionBattery: { on: true } }
  - expect_node: { path: EvLive/EvSettings/Rows/List/battery_conditioning/Lines/Line/Switch, button_pressed: false }
  - set: { core: { precondition: { manualUntil: 1794213000 }, telemetry: { batteryConditioningMode: "on" } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/EvSettings/Rows/List/battery_conditioning/Lines/Line/Switch, button_pressed: true }
  - expect_node: { path: EvLive/EvSettings/Rows/List/battery_conditioning/Lines/Line/Text/Detail, text: "The car's mode: on" }
  - set: { core: { telemetry: { batteryConditioningError: 2 } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/EvSettings/Rows/List/battery_conditioning/Lines/Line/Text/Detail, text: "The car: battery already at temperature" }
  - tap: { node: EvLive/EvSettings/Rows/List/route_precondition/Lines/Line/Switch, with: touch }
  - expect_action: { SetConfig: { patch: { batteryPreconditioning: "off" } } }
  - expect_node: { path: EvLive/EvSettings/Rows/List/winter_mode/Lines/Line/Switch, disabled: true }
  - screenshot: ev-settings-battery
  - set: { core: { config: { batteryPreconditioning: "off" }, precondition: { manualUntil: null } } }
  - wait: { frames: 2 }
  # Off in LIVI is off for the request too.
  - expect_node: { path: EvLive/EvSettings/Rows/List/battery_conditioning/Lines/Line/Switch, disabled: true }
  - tap: { node: EvLive/EvSettings/Sections/List/power }
  - expect_node: { path: EvLive/EvSettings/Rows/List/utility_mode/Lines/Line/Act, disabled: true }
  - expect_node: { path: EvLive/EvSettings/Rows/List/v2l_limit/Lines/Line/Stepper/Value, text: – }
  # Once the car link has a path (EvSettingsLink.fake stands in): what each control sends. A set
  # goes leaf by leaf: the objects first.
  - set: { core: { telemetry: { acChargingCurrent: max, v2lDischargeLimitPct: 30, utilityMode: false } } }
  - gdscript: |
      EvSettingsLink.fake = true
      shell.get_node("EvLive/EvSettings")._refresh(true)
      await runner.frames(2)
  - tap: { node: EvLive/EvSettings/Rows/List/v2l_limit/Lines/Line/Stepper/Minus }
  - tap: { node: EvLive/EvSettings/Rows/List/utility_mode/Lines/Line/Act }
  - tap: { node: EvLive/EvSettings/Sections/List/charging }
  - tap: { node: EvLive/EvSettings/Rows/List/charge_limit_ac/Lines/Line/Stepper/Plus }
  - tap: { node: EvLive/EvSettings/Rows/List/ac_current/Lines/Line/Choice/min, with: touch }
  - expect_node: { path: EvLive/EvSettings/Rows/List/ac_current/Lines/Line/Choice/min, button_pressed: false }
  - gdscript: |
      var want := [["v2l_limit", 20.0], ["utility_mode", true], ["charge_limit_ac", 100.0], ["ac_current", "min"]]
      if str(EvSettingsLink.written) != str(want):
          return "sent %s" % [EvSettingsLink.written]
