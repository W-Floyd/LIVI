name: ev-live
# The Godot-rendered "Electric vehicle" page in the built-in themes. `ev` opens it where the
# theme has no image page of its own. Goldens for the main combinations; the rest are for review.
clock: 2026-11-09T17:42:00
fixtures:
  core: fixtures/ev6-main.json
theme: { theme_name: instrument, appearance: night }
steps:
  # The blower running and the car's climate-off range, as stock's example (243 / 253): both rows.
  - set: { core: { telemetry: { climate: {} } } }
  - set: { core: { telemetry: { rangeClimateOffKm: 253, climate: { source: car, fanLevel: 3, on: true } } } }
  - page: ev
  - expect_node: { path: EvLive/Title, text: Electric vehicle }
  - expect_node: { path: EvLive/RangeOn/Row1/on_value, text: "243" }
  - expect_node: { path: EvLive/RangeOff/Row1/off_value, text: "253" }
  - expect_node: { path: EvLive/Battery/Row1/battery_value, text: "50" }
  - screenshot: ev-live-instrument-night
  - theme: { appearance: day }
  - screenshot: ev-live-instrument-day
  - theme: { theme_name: calm }
  - screenshot: ev-live-calm-day
  - theme: { appearance: night }
  - screenshot: { name: ev-live-calm-night, compare: false }
  - theme: { theme_name: charge }
  - screenshot: ev-live-charge-night
  - theme: { appearance: day }
  - screenshot: { name: ev-live-charge-day, compare: false }
  # The drive side mirrors the scene and moves the gear; the order of the targets stays.
  - theme: { theme_name: instrument, appearance: night, hand: rhd }
  - screenshot: ev-live-instrument-night-rhd
  - theme: { theme_name: calm, appearance: day }
  - screenshot: { name: ev-live-calm-day-rhd, compare: false }
  - theme: { theme_name: instrument, appearance: night, hand: lhd, text_scale: 1.4 }
  - screenshot: ev-live-instrument-night-text-1.4
  # The two ranges never run into each other nor onto the road (their numerals are the road's
  # colours), at the fixtures' long, middle and the unit's short range (43 km, 2026-11-12), the
  # blower on and off, small and large text, the bar's edges and both drive sides.
  - gdscript: |
      for km in [[243, 253], [148, null], [43, 44]]:
          Core.fake_set("telemetry/rangeKm", km[0])
          Core.fake_set("telemetry/rangeClimateOffKm", km[1])
          for blower in [3, 0]:
              Core.fake_set("telemetry/climate/fanLevel", blower)
              Core.fake_set("telemetry/climate/on", blower > 0)
              for ts in [1.0, 1.4]:
                  for pos in ["top", "left", "off"]:
                      for hand in ["lhd", "rhd"]:
                          ThemeManager.set_look({text_scale = ts, status_position = pos, hand = hand})
                          shell.open_page("ev_live")
                          await runner.frames(3)
                          var at := "%s km, blower %s, %s, %s, %s" % [km, blower, ts, pos, hand]
                          var on: Control = shell.get_node("EvLive/RangeOn")
                          var off: Control = shell.get_node("EvLive/RangeOff")
                          if on.visible and off.visible and on.get_global_rect().intersects(off.get_global_rect()):
                              return "%s: the ranges overlap: %s %s" % [at, on.get_global_rect(), off.get_global_rect()]
                          var road: PackedVector2Array = shell.get_node("EvLive/Scene").road_polygon()
                          for l in [on, off]:
                              if l.visible and EvLive._over_road(l.get_global_rect(), road):
                                  return "%s: %s is on the road: %s %s" % [at, l.name, l.get_global_rect(), road]
      Core.fake_set("telemetry/rangeKm", 243)
      Core.fake_set("telemetry/rangeClimateOffKm", 253)
      Core.fake_set("telemetry/climate/fanLevel", 3)
      Core.fake_set("telemetry/climate/on", true)
      ThemeManager.set_look({text_scale = 1.4, status_position = "top", hand = "lhd"})
  # Back to 1.0 on the page itself: the picture drops from the taller targets' lift to where a
  # page opened at 1.0 has it.
  - gdscript: |
      await runner.frames(3)
      var s: EvScene = shell.get_node("EvLive/Scene")
      var high: float = s._lift_px
      ThemeManager.set_look({text_scale = 1.0})
      await runner.frames(2)
      var dropped: float = s._lift_px
      shell.open_page("home")
      shell.open_page("ev_live")
      await runner.frames(3)
      if not is_equal_approx(dropped, s._lift_px) or dropped >= high:
          return "lift %s px at 1.4, %s after 1.0 on the page, %s opened at 1.0" % [high, dropped, s._lift_px]
      ThemeManager.set_look({text_scale = 1.4})
      await runner.frames(2)
  - theme: { text_scale: 1.0, quality: low }
  - screenshot: ev-live-instrument-night-low
  # Surfaces over the scene, and a scene theme, which keeps its own 3D layer for the home page.
  - theme: { quality: normal, material: frosted }
  - screenshot: { name: ev-live-instrument-night-frosted, compare: false }
  - theme: { material: solid, theme_name: studio }
  - screenshot: { name: ev-live-studio-night, compare: false }
  - gdscript: |
      if shell.get_node("Scene").visible:
          return "the scene theme's own layer shows behind the page"
  - page: home
  - gdscript: |
      if not shell.get_node("Scene").visible or shell.get_node_or_null("EvLive") != null:
          return "home did not come back"
