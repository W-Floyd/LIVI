name: home-phone-toggle
# With a phone connected, a split divider in the gutter between home's slot and the cards (a slim
# pill, no column of its own) drags the split: toward the slot's edge shrinks the phone, to the
# edge hides it (Look → Phone on home) and leaves a tab there to drag it out again. A release
# snaps to the nearest of the phone's widths or none, kept in the look, and asks the phone once
# for the area. A tap does nothing. Its target is a full touch size laid over both sides. No
# phone, no handle. A navigation app shares the slot: a toggle under the cards picks it or the
# phone; its window is configured to the slot and moves to the app page from Apps.
clock: 2026-11-09T08:30:00
fixtures:
  core: fixtures/parked.json
  apps: fixtures/apps
  clients:
    - { role: app, app_id: livi-video-main, pattern: grid, size: 1920x1080, buffer: nv12, video: true }
theme: { reduced_motion: true }
steps:
  - set: { core: { config: { projectionWidth: 1920, projectionHeight: 720 } } }
  - wait: { window: livi-video-main }
  - wait: { frames: 2 }
  - gdscript: &clear |
      var h: Control = shell.get_node("Page/PhoneHandle")
      var p: Rect2 = shell.get_node("Page/PhoneHandle/Pill").get_global_rect()
      var content: Rect2 = shell.get_node("Page/Body").get_global_rect()
      var slot: Rect2 = shell.get_node("Page/Body/Slot").get_global_rect()
      var side: Rect2 = shell.get_node("Page/Body/Side").get_global_rect()
      var cards: Rect2 = shell.get_node("Page/Body/Side/Panel").get_global_rect()
      var r := h.get_global_rect()
      if not h.is_visible_in_tree() or minf(r.size.x, r.size.y) < ThemeManager.px.touch - 0.5:
          return "the handle's target at %s, visible %s" % [r, h.is_visible_in_tree()]
      if not r.encloses(p) or not content.encloses(r):
          return "the target %s, the pill %s, the content %s" % [r, p, content]
      if absf(slot.size.x + side.size.x - content.size.x) > 0.5:
          return "a column beside the slot %s and the side %s in %s" % [slot, side, content]
      if p.size.x > 16.0 or p.size.y < ThemeManager.px.touch * 0.6 or absf(p.get_center().y - content.get_center().y) > 1.0:
          return "the pill at %s in %s" % [p, content]
      if p.intersects(cards) or p.intersects(slot):
          return "the pill %s meets the slot %s or the cards %s" % [p, slot, cards]
      if side.size.x < ThemeManager.px.side - 0.5:
          return "the cards %s narrower than their column" % side
      if not ThemeManager.home_phone:
          var off := content.end.x - p.end.x if ThemeManager.side_left() else p.position.x - content.position.x
          if absf(off) > 0.5 or slot.size.x > 0.5:
              return "hidden: the tab at %s, not at the edge of %s (slot %s)" % [p, content, slot]
      elif slot.size.x < ThemeManager.px.side - 0.5:
          return "shown: the slot %s" % slot
  - expect_node: { path: Page/Body/Slot, visible: true }
  - screenshot: { name: home-phone-toggle-shown, tolerance: 8 }
  # Drags from each width: [from, to, snapped], in each home layout. The phone's widths are the
  # snaps (s0 <= s1 <= s2, s1 the default, nearest a half) or none; a release between them takes
  # the nearest, beyond them the last. The picture first: the cards never take more than a third
  # of the body (side by side a half), nor less than their column.
  # A tap, a drag inside the slop or up the handle changes nothing; a double tap goes back to the
  # default, hidden too. The phone is asked once per release that changes the slot, with its size,
  # and never mid-drag.
  - gdscript: &drags |
      var slot: Control = shell.get_node("Page/Body/Slot")
      for layout in ["cards", "split"]:
        ThemeManager.set_look({home_layout = layout})
        await runner.frames(4)
        var snaps: Array = shell._snaps()
        var full: float = shell.get_node("Page/Body").size.x
        var most: float = maxf(ThemeManager.px.side, roundf(full * (0.5 if layout == "split" else 1.0 / 3.0)))
        if snaps.is_empty() or snaps.any(func(w): return w < ThemeManager.px.side - 0.5 or full - w > most + 0.5 or full - w < ThemeManager.px.side - 0.5):
            return "%s: snaps %s of %s" % [layout, snaps, full]
        var half: float = snaps[0]
        for w in snaps:
            if absf(w - full / 2.0) < absf(half - full / 2.0):
                half = w
        var v := {hidden = 0.0, s0 = snaps[0], s1 = half, s2 = snaps.back(), mid01 = (snaps[0] + half) / 2.0 - 10.0,
            past12 = half + 30.0, near0 = snaps[0] * 0.4, far0 = snaps[0] * 0.6, beyond = full + 200.0, under = -200.0}
        var areas := func():
            return Core.fake_sent().filter(func(m): return m.get("type") == "action" and m.action.kind == "projectionArea")
        for row in [["s2", "s0", "s0"], ["s0", "s1", "s1"], ["s1", "s2", "s2"], ["s2", "hidden", "hidden"], ["hidden", "past12", "s1"],
                ["s1", "mid01", "s0"], ["s0", "near0", "hidden"], ["hidden", "far0", "s0"], ["s0", "beyond", "s2"], ["s2", "under", "hidden"],
                ["hidden", "tap", "hidden"], ["s1", "tap", "s1"], ["s1", "tiny", "s1"], ["s1", "up", "s1"],
                ["s0", "double", "s1"], ["s2", "double", "s1"], ["s1", "double", "s1"], ["hidden", "double", "s1"],
                ["s0", "slow", "s0"], ["s2", "apart", "s2"], ["hidden", "slow", "hidden"], ["hidden", "apart", "hidden"]]:
            ThemeManager.set_look({home_phone = row[0] != "hidden", home_split = v[row[0]] / full if row[0] != "hidden" else ThemeManager.home_split})
            # Past the last row's taps.
            await runner.frames(30)
            var before: float = slot.size.x
            if absf(before - v[row[0]]) > 0.5:
                return "%s: the slot is %s from %s" % [row, before, v[row[0]]]
            Core.fake_clear()
            var at: Vector2 = shell.get_node("Page/PhoneHandle/Pill").get_global_rect().get_center()
            # Away from the slot's edge grows the phone.
            var out := -1.0 if ThemeManager.side_left() else 1.0
            var d := Vector2.ZERO
            # Two taps: a double tap; 40 frames (0.67 s) apart, or the second a few mm off, two taps.
            if row[1] in ["double", "slow", "apart"]:
                for pressed in [true, false]:
                    var t := InputEventMouseButton.new()
                    t.position = at
                    t.button_index = MOUSE_BUTTON_LEFT
                    t.pressed = pressed
                    t.button_mask = MOUSE_BUTTON_MASK_LEFT if pressed else 0
                    runner._vp.push_input(t)
                    await runner.frames(1)
                await runner.frames(40 if row[1] == "slow" else 4)
                if row[1] == "apart":
                    at.y += ThemeManager.px.touch * 0.45
            match row[1]:
                "tap", "double", "slow", "apart":
                    pass
                "tiny":
                    d.x = ThemeManager.px.touch_gap * 0.5
                "up":
                    d.y = -ThemeManager.px.touch * 1.5
                _:
                    d.x = (v[row[1]] - before) * out
            for i in 9:
                var m := InputEventMouseMotion.new()
                m.position = at + d * (i / 8.0)
                m.button_mask = MOUSE_BUTTON_MASK_LEFT if i > 0 else 0
                runner._vp.push_input(m)
                if i == 0:
                    var b := InputEventMouseButton.new()
                    b.position = m.position
                    b.button_index = MOUSE_BUTTON_LEFT
                    b.pressed = true
                    b.button_mask = MOUSE_BUTTON_MASK_LEFT
                    runner._vp.push_input(b)
                await runner.frames(1)
            await runner.frames(2)
            if not areas.call().is_empty():
                return "%s: asked mid-drag %s" % [row, areas.call()]
            var u := InputEventMouseButton.new()
            u.position = at + d
            u.button_index = MOUSE_BUTTON_LEFT
            runner._vp.push_input(u)
            await runner.frames(3)
            var want: float = v[row[2]]
            if ThemeManager.home_phone != (row[2] != "hidden") or absf(slot.size.x - want) > 0.5:
                return "%s (%s): shown %s, the slot %s, not %s" % [row, ThemeManager.hand, ThemeManager.home_phone, slot.size.x, want]
            if row[2] != "hidden" and absf(shell._phone_width() - want) > 0.5:
                return "%s: the look keeps %s of %s" % [row, ThemeManager.home_split, full]
            var got: Array = areas.call()
            var asked := 0 if row[2] == "hidden" or absf(want - before) < 0.5 else 1
            if got.size() != asked or (asked == 1 and absf(got[0].action.width - want) > 1.0):
                return "%s: asked %s, not %d of width %s" % [row, got.map(func(m): return m.action), asked, want]
      ThemeManager.set_look({home_phone = true, home_split = 0.0, home_layout = "cards"})
      await runner.frames(2)
  - gdscript: *clear
  - theme: { home_phone: false }
  - gdscript: *clear
  - screenshot: home-phone-toggle-hidden
  # Every edge of the status bar, and none, at each width.
  - theme: { status_position: left, home_phone: true, home_split: 0.34 }
  - gdscript: *clear
  - theme: { status_position: right, home_split: 0.5 }
  - gdscript: *clear
  - screenshot: home-phone-toggle-half-status-right
  - theme: { status_position: bottom }
  - gdscript: *clear
  - theme: { status_position: off, home_split: 0.0 }
  - gdscript: *clear
  - theme: { home_phone: false }
  - gdscript: *clear
  - theme: { status_position: left }
  - gdscript: *clear
  - theme: { status_position: top, home_phone: true }
  - gdscript: *clear
  # Kept in the look: a restart comes back at the width last chosen.
  - gdscript: |
      var file := OS.get_user_data_dir().path_join("home-phone-toggle-look.json")
      ThemeManager.look_file = file
      ThemeManager.set_look({home_split = 1.0 / 3.0})
      ThemeManager.save_look()
      ThemeManager.defaults()
      # Defaults animate.
      await runner.frames(40)
      var slot: Control = shell.get_node("Page/Body/Slot")
      var half: float = shell._phone_width()
      if absf(slot.size.x - half) > 0.5:
          return "defaults: the slot %s, not %s" % [slot.size.x, half]
      ThemeManager.load_look(file)
      DirAccess.remove_absolute(file)
      DirAccess.remove_absolute(ThemeManager.tokens_file)
      ThemeManager.look_file = ""
      ThemeManager.tokens_file = ""
      await runner.frames(2)
      if absf(slot.size.x - shell._snaps()[0]) > 0.5:
          return "restarted: the slot %s, not %s" % [slot.size.x, shell._snaps()[0]]
      ThemeManager.set_look({home_split = 0.0, reduced_motion = true})
      await runner.frames(2)
  # The driver's side, and the phone nearer the driver on the panel: mirrored, always from the
  # slot's edge.
  - theme: { hand: rhd }
  - gdscript: *clear
  - gdscript: *drags
  - theme: { home_phone: false }
  - gdscript: *clear
  - screenshot: home-phone-toggle-hidden-rhd
  - theme: { status_position: right }
  - gdscript: *clear
  - theme: { status_position: top, home_phone: true, hand: lhd, near: panel }
  - gdscript: *clear
  - gdscript: *drags
  - theme: { near: projection, hand: rhd }
  # Night, glass, and a scene theme's slab behind the pill.
  - theme: { home_phone: true, appearance: night }
  - gdscript: *clear
  - screenshot: home-phone-toggle-shown-night-rhd
  - theme: { material: glass }
  - gdscript: *clear
  - theme: { material: solid, theme_name: studio }
  - gdscript: *clear
  - gdscript: |
      var pill: Control = shell.get_node("Page/PhoneHandle/Pill")
      if not shell._scene or not pill in shell._scene.surfaces:
          return "no slab for the pill"
  # A navigation app (the test client's grid, following each configure and logging it) designated:
  # with the phone there the slot stays the phone's and the app starts unseen; a toggle under the
  # cards on the slot's side, clear of both, picks between them.
  - theme: { theme_name: instrument, appearance: day, hand: lhd, home_split: 0.0 }
  - gdscript: |
      shell.launcher.refresh()
      for a in shell.launcher.apps:
          if a.id == "org.livi.test.grid":
              a.argv[a.argv.find("--size") + 1] = "0x0"
              # A text field in its top half, for the keyboard beside the slot.
              a.argv.append_array(["--events", runner._client_events("org.livi.test.grid"), "--text-input", "normal"])
      DirAccess.make_dir_recursive_absolute(runner._client_events("org.livi.test.grid").get_base_dir())
      ThemeManager.set_look({nav_app = "org.livi.test.grid"})
      await runner.frames(3)
      if shell.slot_source() != "phone" or not shell._projection.window.to_core:
          return "with the phone: the slot shows %s" % shell.slot_source()
      # Designated, it starts at once, quietly.
      if not shell.launcher.state("org.livi.test.grid") in ["launching", "running"] or shell._page_name != "home":
          return "designated: %s, page %s" % [shell.launcher.state("org.livi.test.grid"), shell._page_name]
  - gdscript: &source |
      var t: Control = shell.get_node("Page/Source")
      var r := t.get_global_rect()
      var side: Rect2 = shell.get_node("Page/Body/Side").get_global_rect()
      var slot: Rect2 = shell.get_node("Page/Body/Slot").get_global_rect()
      var cards: Rect2 = shell.get_node("Page/Body/Side/Panel").get_global_rect()
      if not t.is_visible_in_tree() or r.size.y < ThemeManager.px.touch - 0.5:
          return "the toggle at %s, visible %s" % [r, t.is_visible_in_tree()]
      if not side.encloses(r) or r.intersects(slot) or r.intersects(cards) or r.intersects(shell.get_node("Page/PhoneHandle/Pill").get_global_rect()):
          return "the toggle %s, the side %s, the slot %s, the cards %s" % [r, side, slot, cards]
      # On the slot's side of the column.
      var m := float(roundi(ThemeManager.px.gap * 1.5))
      var off := side.end.x - m - r.end.x if ThemeManager.side_left() else r.position.x - side.position.x - m
      if absf(off) > 0.5:
          return "the toggle %s off the slot's side of %s by %s" % [r, side, off]
      for b in t.get_node("Box").get_children():
          if b.size.y < ThemeManager.px.touch - 0.5 or b.size.x < ThemeManager.px.touch:
              return "%s is %s" % [b.name, b.size]
  - screenshot: home-nav-toggle-phone
  # Picked: started without the app page, shown in the slot, configured to it at each snap; the
  # phone gives up video focus. A drag reconfigures it once, on the release.
  - tap: { node: Page/Source/Box/Nav }
  - wait: { window: org.livi.test.grid }
  - gdscript: &nav_sizes |
      var w: int = Wayland.find_window("org.livi.test.grid")
      var slot: Control = shell.get_node("Page/Body/Slot")
      var events: String = runner._client_events("org.livi.test.grid")
      var last := func() -> String:
          var got := ""
          for line in FileAccess.get_file_as_string(events).split("\n", false):
              if line.begins_with("configure "):
                  got = line
          return got
      var full: float = shell.get_node("Page/Body").size.x
      if shell._page_name != "home" or shell.slot_source() != "nav" or ThemeManager.home_source != "nav":
          return "page %s, the slot %s" % [shell._page_name, shell.slot_source()]
      if shell._shows_projection():
          return "the phone keeps video focus beside the navigation app"
      for s in shell._snaps():
          ThemeManager.set_look({home_split = s / full})
          await runner.frames(3)
          var k: float = Wayland.window_scale(w)
          var want := "configure %dx%d" % [roundi(slot.size.x / k), roundi(slot.size.y / k)]
          for i in 120:
              if last.call() == want:
                  break
              await runner.frames(1)
          if last.call() != want:
              return "at %s (%s): %s, not %s" % [s, ThemeManager.hand, last.call(), want]
          if shell._projection.window.window_id != w or shell._projection.window.to_core or shell._projection.get_global_rect() != slot.get_global_rect():
              return "at %s the slot shows %d over %s" % [s, shell._projection.window.window_id, shell._projection.get_global_rect()]
      var at: Vector2 = shell.get_node("Page/PhoneHandle/Pill").get_global_rect().get_center()
      var d := Vector2(-140.0 if not ThemeManager.side_left() else 140.0, 0.0)
      var before: String = last.call()
      for i in 9:
          var m := InputEventMouseMotion.new()
          m.position = at + d * (i / 8.0)
          m.button_mask = MOUSE_BUTTON_MASK_LEFT if i > 0 else 0
          runner._vp.push_input(m)
          if i == 0:
              var b := InputEventMouseButton.new()
              b.position = m.position
              b.button_index = MOUSE_BUTTON_LEFT
              b.pressed = true
              b.button_mask = MOUSE_BUTTON_MASK_LEFT
              runner._vp.push_input(b)
          await runner.frames(2)
      if last.call() != before:
          return "reconfigured mid-drag: %s" % last.call()
      var u := InputEventMouseButton.new()
      u.position = at + d
      u.button_index = MOUSE_BUTTON_LEFT
      runner._vp.push_input(u)
      await runner.frames(3)
      var k: float = Wayland.window_scale(w)
      var want := "configure %dx%d" % [roundi(slot.size.x / k), roundi(slot.size.y / k)]
      for i in 120:
          if last.call() == want:
              break
          await runner.frames(1)
      if last.call() != want:
          return "released at %s: %s, not %s" % [slot.size, last.call(), want]
      ThemeManager.set_look({home_split = 0.0})
      await runner.frames(3)
  - gdscript: *source
  - screenshot: home-nav-toggle-nav
  # A finger in the slot reaches the app.
  - tap: { node: Projection/Window, with: touch }
  - gdscript: |
      for i in 60:
          if FileAccess.get_file_as_string(runner._client_events("org.livi.test.grid")).contains("touch down 0"):
              return ""
          await runner.frames(1)
      return "no touch reached the navigation app"
  # Its field at each snap: the keyboard takes the cards' column, at least the app page's share,
  # the app is configured to the slot's rest and shown there; every key fits, none over another;
  # cancel gives the app the slot back.
  - gdscript: |
      var w: int = Wayland.find_window("org.livi.test.grid")
      var slot: Control = shell.get_node("Page/Body/Slot")
      var events: String = runner._client_events("org.livi.test.grid")
      var last := func() -> String:
          var got := ""
          for line in FileAccess.get_file_as_string(events).split("\n", false):
              if line.begins_with("configure "):
                  got = line
          return got
      var wait_for := func(want: String) -> bool:
          for i in 120:
              if last.call() == want:
                  return true
              await runner.frames(1)
          return false
      var full: float = shell.get_node("Page/Body").size.x
      for s in shell._snaps():
          ThemeManager.set_look({home_split = s / full})
          await runner.frames(3)
          var k: float = Wayland.window_scale(w)
          var at: Vector2 = slot.get_global_rect().position + Vector2(60.0, 20.0)
          await runner._touch(at)
          for i in 60:
              if shell.app_keyboard != null and not shell.app_keyboard.moving():
                  break
              await runner.frames(1)
          var kb: AppKeyboard = shell.app_keyboard
          if kb == null:
              return "at %s no keyboard for the navigation app's field" % s
          var kr := kb.get_global_rect()
          var pr: Rect2 = shell._projection.get_global_rect()
          if kr.size.x < roundf(shell.size.x * 0.55) - 1.0 or kr.size.x < shell.get_node("Page/Body/Side").size.x - 1.0:
              return "at %s the keyboard is %s" % [s, kr]
          if pr.intersects(kr.grow(-1.0)) or not slot.get_global_rect().grow(0.5).encloses(pr) or pr.size.x < 1.0:
              return "at %s the app at %s, the keyboard at %s, the slot %s" % [s, pr, kr, slot.get_global_rect()]
          var want := "configure %dx%d" % [roundi(pr.size.x / k), roundi(pr.size.y / k)]
          if not await wait_for.call(want):
              return "at %s with the keyboard: %s, not %s" % [s, last.call(), want]
          var rects := []
          for b in kb.keyboard.get_node("Keys").get_children():
              var r: Rect2 = b.get_global_rect()
              if not kr.grow(0.5).encloses(r):
                  return "at %s %s at %s, outside %s" % [s, b.name, r, kr]
              for o in rects:
                  if o.grow(-0.5).intersects(r.grow(-0.5)):
                      return "at %s %s at %s over another key" % [s, b.name, r]
              rects.append(r)
          kb.get_node("Keyboard/Keys/Cancel").button_down.emit()
          await runner.frames(30)
          want = "configure %dx%d" % [roundi(slot.size.x / k), roundi(slot.size.y / k)]
          if shell.app_keyboard != null or not await wait_for.call(want):
              return "at %s after cancel: %s, not %s" % [s, last.call(), want]
      ThemeManager.set_look({home_split = 0.0})
      await runner.frames(3)
  # Back to the phone: the app keeps running; the phone has video focus and the slot again.
  - tap: { node: Page/Source/Box/Phone }
  - wait: { frames: 30 }
  - gdscript: |
      if not shell._projection.window.to_core or not shell._shows_projection() or ThemeManager.home_source != "phone":
          return "the slot shows %d" % shell._projection.window.window_id
      if Wayland.find_window("org.livi.test.grid") < 0 or shell.launcher.state("org.livi.test.grid") != "running":
          return "the navigation app stopped: %s" % shell.launcher.state("org.livi.test.grid")
      var asked: Array = Core.fake_sent().filter(func(m): return m.get("type") == "action" and m.action.kind == "projectionArea")
      if asked.is_empty():
          return "the phone was not asked for the slot again"
  # Opened from Apps: the one window moves to the app page at the app area, and back to the slot.
  - tap: { node: Page/Source/Box/Nav }
  - wait: { frames: 3 }
  - page: apps
  - tap: { node: Apps/Scroll/List/Grid/org_livi_test_grid }
  - wait: { frames: 3 }
  - gdscript: |
      var w: int = Wayland.find_window("org.livi.test.grid")
      if shell._page_name != "app" or shell._projection.window.window_id != w or Wayland.window_count() != 2:
          return "page %s shows %d of %d windows" % [shell._page_name, shell._projection.window.window_id, Wayland.window_count()]
      var k: float = Wayland.window_scale(w)
      var want := "configure %dx%d" % [roundi(1920.0 / k), roundi(720.0 / k)]
      var got := ""
      for i in 120:
          for line in FileAccess.get_file_as_string(runner._client_events("org.livi.test.grid")).split("\n", false):
              if line.begins_with("configure "):
                  got = line
          if got == want:
              return ""
          await runner.frames(1)
      return "on the app page %s, not %s" % [got, want]
  - page: home
  - gdscript: *nav_sizes
  # RHD: mirrored, the toggle on the slot's side still.
  - theme: { hand: rhd }
  - gdscript: *source
  - gdscript: *nav_sizes
  - theme: { hand: lhd, status_position: left }
  - gdscript: *source
  - theme: { status_position: top, material: glass }
  - gdscript: *source
  - gdscript: |
      if shell._projection.get_global_rect() != shell.get_node("Page/Body/Slot").get_global_rect():
          return "under glass the navigation app is %s, not the slot" % shell._projection.get_global_rect()
  - theme: { material: solid }
  # Settings → Look names it and says it counts as safe while driving; kept with the look.
  - page: settings
  - gdscript: |
      var s: SettingsPage = shell.get_node("Settings")
      s.open_section(SettingsPage.LOOK)
      await runner.frames(2)
      var row: Dictionary = s._look_row("nav_app")
      if row.get("value") != "Grid pattern" or not str(row.get("detail")).contains("driving") or not s.get_node("Rows/List").has_node("Navigation app"):
          return "the row %s" % row
      var file := OS.get_user_data_dir().path_join("home-nav-look.json")
      ThemeManager.look_file = file
      ThemeManager.save_look()
      ThemeManager.set_look({nav_app = "", home_source = "phone"})
      ThemeManager.load_look(file)
      DirAccess.remove_absolute(file)
      DirAccess.remove_absolute(ThemeManager.tokens_file)
      ThemeManager.look_file = ""
      ThemeManager.tokens_file = ""
      if ThemeManager.nav_app != "org.livi.test.grid" or ThemeManager.home_source != "nav":
          return "restarted: %s, %s" % [ThemeManager.nav_app, ThemeManager.home_source]
  - page: home
  - wait: { frames: 3 }
  - gdscript: |
      if shell._projection.window.window_id != Wayland.find_window("org.livi.test.grid"):
          return "the slot shows %d after the restart" % shell._projection.window.window_id
      ThemeManager.set_look({nav_app = ""})
      await runner.frames(3)
      if not shell._projection.window.to_core or shell.get_node("Page/Source").visible:
          return "no navigation app: the slot shows %d" % shell._projection.window.window_id
  # The phone gone: no handle.
  - gdscript: |
      for pid in runner._clients:
          OS.kill(pid)
      for i in 300:
          if not shell.has_phone():
              break
          await runner.frames(1)
      await runner.frames(2)
      if shell.get_node("Page/PhoneHandle").visible:
          return "the handle shows with no phone"
  # No phone, a navigation app: the slot and its handle are the app's, with no toggle.
  - gdscript: |
      ThemeManager.set_look({nav_app = "org.livi.test.grid", home_source = "phone"})
      await runner.frames(3)
      var w: int = Wayland.find_window("org.livi.test.grid")
      if shell.slot_source() != "nav" or shell._projection.window.window_id != w or not shell.get_node("Page/PhoneHandle").visible:
          return "no phone: the slot shows %d (%s), the handle %s" % [shell._projection.window.window_id, shell.slot_source(), shell.get_node("Page/PhoneHandle").visible]
      if shell.get_node("Page/Source").visible:
          return "a toggle with nothing to toggle to"
  # A restart with it designated (the shell rebuilt, as at boot) and the page restored to Apps or
  # Settings: it starts at once, quietly, wherever the shell opens. A catalog read late starts it
  # once it lists it.
  - gdscript: |
      for page in ["apps", "settings", "late"]:
          var old: Control = runner._shell
          ThemeManager.set_look({nav_app = "org.livi.test.grid", home_source = "nav"})
          # Its launcher stops what it started.
          old.get_parent().remove_child(old)
          old.free()
          for i in 600:
              if Wayland.find_window("org.livi.test.grid") < 0:
                  break
              await runner.frames(1)
          if Wayland.find_window("org.livi.test.grid") >= 0:
              return "%s: the app outlived the shell" % page
          var s: Control = load("res://shell.tscn").instantiate()
          if page == "late":
              s._apps_scanned = true
          runner._vp.add_child(s)
          runner._shell = s
          s.open_page.call_deferred("home" if page == "late" else page)
          await runner.frames(30)
          if page == "late":
              if s.launcher.state("org.livi.test.grid") != "":
                  return "late: started before the catalog listed it"
              s.launcher.refresh()
          for i in 600:
              if Wayland.find_window("org.livi.test.grid") >= 0:
                  break
              await runner.frames(1)
          if Wayland.find_window("org.livi.test.grid") < 0:
              return "%s: the navigation app did not start" % page
          await runner.frames(3)
          if s._page_name != ("home" if page == "late" else page):
              return "%s: the page is %s" % [page, s._page_name]
  # Killed, it is started again after a wait; closed from the switcher, it stays closed.
  - gdscript: |
      var s: Control = runner._shell
      var w: int = Wayland.find_window("org.livi.test.grid")
      OS.kill(Wayland.window_pid(w))
      for i in 300:
          if Wayland.find_window("org.livi.test.grid") < 0:
              break
          await runner.frames(1)
      await runner.frames(60)
      if Wayland.find_window("org.livi.test.grid") >= 0:
          return "started again with no wait"
      for i in 600:
          if Wayland.find_window("org.livi.test.grid") >= 0:
              break
          await runner.frames(1)
      w = Wayland.find_window("org.livi.test.grid")
      if w < 0:
          return "not started again after it was killed"
      s.launcher.close(w)
      for i in 600:
          if Wayland.find_window("org.livi.test.grid") < 0:
              break
          await runner.frames(1)
      await runner.frames(300)
      if Wayland.find_window("org.livi.test.grid") >= 0 or s.launcher.state("org.livi.test.grid") != "":
          return "started again after the driver closed it: %s" % s.launcher.state("org.livi.test.grid")
