name: home-precondition
viewport: { width: 1920, height: 720 }
clock: 2026-11-09T08:30:00
fixtures:
  core: fixtures/parked.json
steps:
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Stat, value: "64" }
  - screenshot: home-idle
  - record: precondition-on-off
  - tap: { node: Page/Body/Side/Panel/Precondition }
  - expect_action: { PreconditionBattery: { on: true } }
  - set: { core: { precondition: { manualUntil: 1794213000 }, telemetry: { fuelPct: 63.0 } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, label: Warming battery, button_pressed: true }
  - gdscript: |
      # The tile and the core's mirror agree on the patched charge.
      var shown: String = shell.get_node("Page/Body/Side/Panel/Stat").value
      var mirrored = Core.get_value("/telemetry/fuelPct")
      if shown != str(roundi(mirrored)):
          return "shows %s, the core has %s" % [shown, mirrored]
  - tap: { node: Page/Body/Side/Panel/Precondition }
  - expect_action: { PreconditionBattery: { on: false } }
  - set: { core: { precondition: { manualUntil: null } } }
  # Automatic, for a fast charger on the route: on in LIVI, but no car link reports it.
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition/Auto, disabled: true, button_pressed: true }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, detail: "for 30 min · no auto" }
  - set: { core: { telemetry: { preconditionState: armed, preconditionWhy: no route } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition/Auto, disabled: false, button_pressed: true }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, detail: for 30 min }
  # A route to a slow charger: why it waits.
  - set: { core: { navigation: { chargingStop: {} } } }
  - set: { core: { telemetry: { preconditionWhy: "the charger is 11 kW, not above 50" }, navigation: { chargingStop: { powerW: 11000, distanceM: 12000, timeS: 900 } } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, detail: "auto: 11 kW, not above 50" }
  - set: { core: { telemetry: { preconditionState: running, preconditionWhy: "" }, navigation: { chargingStop: { powerW: 350000, distanceM: 42000, timeS: 1800 } } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, label: Warming for charger, detail: 350 kW · 42 km, button_pressed: false }
  - screenshot: home-precondition-auto
  - tap: { node: Page/Body/Side/Panel/Precondition/Auto }
  - expect_action: { SetConfig: { patch: { batteryPreconditioning: "off" } } }
  # Off in LIVI is off for the manual request too; the chip turns it back on.
  - set: { core: { config: { batteryPreconditioning: "off" }, telemetry: { preconditionState: "off", preconditionWhy: "off in LIVI's settings" }, navigation: { chargingStop: null } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, disabled: true, detail: off in settings }
  - expect_node: { path: Page/Body/Side/Panel/Precondition/Auto, disabled: false, button_pressed: false }
  - screenshot: home-precondition-auto-off
  - tap: { node: Page/Body/Side/Panel/Precondition/Auto }
  - expect_action: { SetConfig: { patch: { batteryPreconditioning: auto } } }
  # The car's own word: its conditioning mode while asked, conditioning it runs, why it would not.
  - set: { core: { config: { batteryPreconditioning: auto }, precondition: { manualUntil: 1794213000 }, telemetry: { preconditionState: armed, preconditionWhy: "", batteryConditioningMode: "off" } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, label: Warming battery, detail: car mode off, button_pressed: true }
  - set: { core: { telemetry: { batteryConditioningMode: "on" } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, detail: car mode on }
  - set: { core: { telemetry: { batteryConditioning: true } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, label: Warming battery, detail: running }
  - set: { core: { precondition: { manualUntil: null } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, label: Warming battery, detail: by the car, button_pressed: false }
  - set: { core: { telemetry: { batteryConditioning: false, batteryConditioningError: 2 } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, label: Precondition battery, detail: battery already at temperature }
  - set: { core: { telemetry: { batteryConditioningError: null, batteryConditioningMode: null } } }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body/Side/Panel/Precondition, detail: for 30 min }
