name: kia-ev6
# Local only: needs the EV6 pack built by tools/import-vendor (not in the repo) in the packs
# directory as kia-ev6; skipped where it is missing. Its reference is the importer's composite of
# the stock screen until one is captured on the unit.
requires: { theme: kia-ev6 }
fixtures:
  core: fixtures/ev6-main.json
theme: { theme_name: kia-ev6, appearance: night }
steps:
  - page: ev_main
  - compare_reference: { name: kia-ev6-main-night, reference: reference/ev_main_night.png, min: 0.99 }
  - screenshot: { name: kia-ev6-main-night, compare: false }
  - theme: { appearance: day }
  - compare_reference: { name: kia-ev6-main-day, reference: reference/ev_main_day.png, min: 0.99 }
  - screenshot: { name: kia-ev6-main-day, compare: false }
  # The same screen drawn live: the 3D scene, the shell's own components and the pack's strings,
  # type and layout. Live 3D is not the stock artwork: the road, the car and the pin differ in
  # every pixel they cover, which is a fifth of the panel, so the bar is 0.75 (it measures 0.78: the road and car now line up with the stock render, the rest is the 3D shading).
  # The title bar, text and targets are the stock rectangles.
  - page: ev_live
  # The core's charging stop has no name yet: the stock screen's own.
  - set: { core: { navigation: { chargingStop: { name: Digital Energy Solutions } } } }
  - wait: { frames: 2 }
  - expect_node: { path: EvLive/Title, text: Electric Vehicle, rect: [792, 94, 337, 90] }
  - expect_node: { path: EvLive/next_departure, rect: [21, 620, 547, 81] }
  - expect_node: { path: EvLive/Settings, rect: [1800, 609, 96, 96] }
  - expect_node: { path: EvLive/ChargerLabel/Row0/charger_name, text: Digital Energy Solutions }
  - theme: { appearance: night }
  - compare_reference: { name: kia-ev6-live-night, reference: reference/ev_main_night.png, min: 0.75 }
  - screenshot: { name: kia-ev6-live-night, compare: false }
  - theme: { appearance: day }
  - compare_reference: { name: kia-ev6-live-day, reference: reference/ev_main_day.png, min: 0.75 }
  - screenshot: { name: kia-ev6-live-day, compare: false }
  # Right-hand drive: the scene and the gear mirror, the order of the targets does not.
  - theme: { hand: rhd }
  - screenshot: { name: kia-ev6-live-day-rhd, compare: false }
  - theme: { appearance: night }
  - screenshot: { name: kia-ev6-live-night-rhd, compare: false }
  - gdscript: |
      var gear: Control = shell.get_node("EvLive/Settings")
      var first: Control = shell.get_node("EvLive/next_departure")
      var last: Control = shell.get_node("EvLive/v2l")
      if not (gear.position.x < first.position.x and first.position.x < last.position.x):
          return "gear %s, targets %s %s" % [gear.position.x, first.position.x, last.position.x]
  # The page the theme asks for by default is the image page, where the pack has one.
  - theme: { hand: lhd }
  - page: ev
  - expect_node: { path: Screen/layout_main_title, text: Electric Vehicle }
  - theme: { ev_page: live }
  - page: ev
  - expect_node: { path: EvLive/Title, text: Electric Vehicle }
