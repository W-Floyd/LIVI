name: settings-apps
# An app's settings from the schema it installs (godot-maps' "Maps"): a section of the Settings
# page whose rows write the app's values file, which the app may change too; and the resolved
# look the shell writes for hosted apps (tokens.json).
viewport: { width: 1920, height: 720 }
clock: 2026-11-09T08:30:00
fixtures:
  core: fixtures/parked.json
steps:
  - gdscript: |
      SettingsPage.app_dirs = PackedStringArray([runner._tests.path_join("fixtures/app-settings")])
      var home := OS.get_temp_dir().path_join("livi-shell-settings-apps")
      SettingsPage.config_home = home
      DirAccess.make_dir_recursive_absolute(home.path_join("godot-maps"))
      var f := FileAccess.open(home.path_join("godot-maps/settings.json"), FileAccess.WRITE)
      f.store_string('{"theme": "dark", "kept": 1}')
      f.close()
  - page: settings
  - gdscript: |
      if not shell.has_node("Settings/Sections/List/Maps"):
          return "no Maps section"
      # A values path out of the config dir is refused.
      if shell.has_node("Settings/Sections/List/Escape"):
          return "a schema writing outside the config dir was taken"
  - tap: { node: Settings/Sections/List/Maps }
  - expect_node: { path: Settings/Heading/Title, text: Maps }
  - wait: { frames: 3 }
  - gdscript: |
      var rows := "Settings/Rows/List/"
      if not shell.get_node(rows + "Map colours/Box/Choice/Night").button_pressed:
          return "Map colours does not show the file's dark"
      if not shell.get_node(rows + "Road markings/Box/Switch").on:
          return "Road markings does not show its default"
      if shell.get_node(rows + "Road colours/Box/Level/Slider").value < 0.6:
          return "Road colours does not show its default"
  - tap: { node: Settings/Rows/List/Road markings }
  - tap: { node: Settings/Rows/List/Map colours/Box/Choice/Auto }
  # Too many options to set in place: its own list, closed by the pick.
  - tap: { node: Settings/Rows/List/Tile cache }
  - expect_node: { path: Settings/Heading/Title, text: Tile cache }
  - tap: { node: Settings/Rows/List/800 MB }
  - expect_node: { path: Settings/Heading/Title, text: Maps }
  - gdscript: |
      var v = JSON.parse_string(FileAccess.get_file_as_string(SettingsPage.config_home.path_join("godot-maps/settings.json")))
      if not v is Dictionary or v.get("road_markings") != false or v.get("theme") != "auto" or int(v.get("tile_cache_mb", 0)) != 800 or int(v.get("kept", 0)) != 1:
          return "values file: %s" % [v]
  # The app writes the file too: the open page follows.
  - gdscript: |
      var f := FileAccess.open(SettingsPage.config_home.path_join("godot-maps/settings.json"), FileAccess.WRITE)
      f.store_string('{"road_markings": true, "theme": "light"}')
      f.close()
      await runner.frames(45)
      var rows := "Settings/Rows/List/"
      if not shell.get_node(rows + "Road markings/Box/Switch").on or not shell.get_node(rows + "Map colours/Box/Choice/Day").button_pressed:
          return "the page did not follow the app's change"
  # Every row's control inside its card and the page, in every section at text 1.0 and 1.4, each
  # status bar edge and hand; a control the text leaves no room for goes under it. Settings' title
  # and back button only without a docked rail (here, then beside one).
  - theme: { theme_name: calm, material: frosted, reduced_motion: true }
  - gdscript: &fits |
      var s: SettingsPage = shell.get_node("Settings")
      var rows: DragScroll = s.get_node("Rows")
      var docked: bool = runner._vp.has_node("NavRail")
      var sections: Array = ["app:godot-maps", "look"] + range(s._view.get("sections", []).size())
      for text in [1.0, 1.4]:
          for pos in ["top", "bottom", "left", "right", "off"]:
              for hand in ["lhd", "rhd"]:
                  ThemeManager.set_look({text_scale = text, status_position = pos, hand = hand})
                  for sec in sections:
                      s.open_section(sec)
                      await runner.frames(2)
                      var at := "rail %s, text %s, %s, %s, %s: " % [docked, text, pos, hand, sec]
                      for n in ["Back", "Title"]:
                          if s.get_node("Header/" + n).visible == docked:
                              return at + "the header's %s shown: %s" % [n, not docked]
                      var page := s.get_global_rect()
                      var rr := rows.get_global_rect()
                      for b in rows.list.get_children():
                          var br: Rect2 = b.get_global_rect()
                          if br.position.x < rr.position.x - 0.5 or br.end.x > minf(rr.end.x, page.end.x) + 0.5:
                              return at + "%s at %s is past the list %s" % [b.name, br, rr]
                          for c in b.find_children("*", "Control", true, false):
                              var cr: Rect2 = c.get_global_rect()
                              if c.is_visible_in_tree() and cr.has_area() and not br.grow(0.5).encloses(cr):
                                  return at + "%s at %s is past its card %s" % [b.get_path_to(c), cr, br]
                      if str(sec) == "app:godot-maps" and docked and text == 1.0 and pos == "top" and hand == "lhd":
                          # The panel's width beside the rail: the profile's options under its text.
                          var row: Control = rows.list.get_node("Performance profile")
                          var choice: Control = row.get_node_or_null("Below/Choice")
                          var label: Control = row.get_node("Box").find_children("*", "Label", true, false)[1]
                          if choice == null or choice.get_global_rect().position.y < label.get_global_rect().end.y:
                              return at + "the profile's choice is not under its text: %s" % [row.find_children("Choice", "", true, false)]
      ThemeManager.set_look({text_scale = 1.0, status_position = "top", hand = "lhd"})
      s.open_section("app:godot-maps")
      await runner.frames(2)
  - gdscript: |
      NavRail.attach(shell).show_page("settings")
      await runner.frames(3)
  - gdscript: *fits
  # Under its text once it does not fit beside it, and back only with a touch target to spare: no
  # flip-flop at the edge.
  - gdscript: |
      var s: SettingsPage = shell.get_node("Settings")
      var row: Control = s.get_node("Rows/List/Performance profile")
      var under := func() -> bool: return row.has_node("Below/Choice")
      var y := s.size.y
      var w0 := s.size.x
      var back := -1.0
      for i in 800:
          s.size = Vector2(w0 + i * 2.0, y)
          if not under.call():
              back = s._rows.size.x
              break
      var again := -1.0
      for i in 800:
          s.size = Vector2(s.size.x - 2.0, y)
          if under.call():
              again = s._rows.size.x
              break
      shell._fit_page(s)
      await runner.frames(2)
      if back < 0.0 or again < 0.0 or back - again < ThemeManager.px.touch - 2.0:
          return "beside its text from a list %s wide, under it again from %s" % [back, again]
      if not under.call():
          return "not under its text again at the panel's width"
      var rows: DragScroll = s.get_node("Rows")
      rows.reveal(row)
      rows.offset += rows.size.y * 0.25
      await runner.frames(2)
  - screenshot: settings-maps-rail
  # With no header, Apply goes at the end of the open section's heading.
  - set: { core: { sessions: { total: 1 } } }
  - tap: { node: Settings/Sections/List/General }
  - wait: { frames: 20 }
  - set: { core: { config: { carName: Kia } } }
  - wait: { frames: 20 }
  - gdscript: |
      var s: SettingsPage = shell.get_node("Settings")
      var a: Rect2 = s.get_node("Header/Apply").get_global_rect()
      var h: Rect2 = s.get_node("Heading").get_global_rect()
      var t: Rect2 = s.get_node("Heading/Title").get_global_rect()
      if not s.get_node("Header/Apply").visible or not h.grow(0.5).encloses(a) or t.end.x > a.position.x:
          return "Apply at %s, the heading at %s, its title at %s" % [a, h, t]
  - screenshot: settings-apply-rail
  - tap: { node: Settings/Header/Apply }
  - expect_action: { ApplySettings: null }
  # tokens.json: the look resolved, as the shell shows it, rewritten when it changes, Auto's
  # resolution from the car's night mode included; nothing while Auto is unresolved.
  - gdscript: |
      ThemeManager.tokens_file = SettingsPage.config_home.path_join("livi-shell/tokens.json")
      var bad := ""
      # [the core's night mode, the look set (none: only the car changes), tokens' appearance ("": no file)]
      for row in [
              [false, {appearance_mode = "night", text_scale = 1.2, hand = "rhd"}, "night"],
              [true, {appearance_mode = "day", text_scale = 1.0, hand = "lhd"}, "day"],
              [true, {appearance_mode = "auto"}, "night"],
              [false, {}, "day"],
              [true, {}, "night"],
              [null, {text_scale = 1.1}, ""],
              [true, {}, "night"]]:
          DirAccess.remove_absolute(ThemeManager.tokens_file)
          Core.fake_set("config/mainUiNightMode", row[0])
          if not row[1].is_empty():
              ThemeManager.set_look(row[1])
          await runner.frames(20)
          var at := "night mode %s, look %s: " % [row[0], row[1]]
          if row[2] == "":
              if FileAccess.file_exists(ThemeManager.tokens_file):
                  bad = at + "tokens.json written unresolved"
                  break
              continue
          var t = JSON.parse_string(FileAccess.get_file_as_string(ThemeManager.tokens_file))
          if not t is Dictionary:
              bad = at + "no tokens.json"
          elif t.appearance != row[2] or ThemeManager.appearance != row[2]:
              bad = at + "tokens %s, the shell %s, want %s" % [t.appearance, ThemeManager.appearance, row[2]]
          elif t.hand != ThemeManager.hand or not is_equal_approx(float(t.text_scale), ThemeManager.text_scale) or int(t.version) != 1:
              bad = at + "tokens look: %s" % [[t.hand, t.text_scale, t.version]]
          # Every token: godot-maps colours its map from proj, accent, on_accent, text, dim, warn and crit.
          elif t.colors.keys().size() != ThemeManager.c.size() or ThemeManager.c.keys().any(func(k): return not t.colors.has(k) or not Color(t.colors[k]).is_equal_approx(ThemeManager.c[k])):
              bad = at + "tokens colors: %s" % [t.colors]
          elif not is_equal_approx(float(t.px.body), snappedf(ThemeManager.px.body, 0.01)) or not t.fonts.body.has("weight"):
              bad = at + "tokens px or fonts: %s %s" % [t.px, t.fonts]
          elif not FileAccess.file_exists(str(t.fonts.body.get("path", ""))):
              bad = at + "tokens font path: %s" % [t.fonts.body]
          if bad != "":
              break
      ThemeManager.set_look({appearance_mode = "day", text_scale = 1.0, hand = "lhd"})
      ThemeManager.tokens_file = ""
      for p in ["livi-shell/tokens.json", "godot-maps/settings.json"]:
          DirAccess.remove_absolute(SettingsPage.config_home.path_join(p))
      SettingsPage.app_dirs = SettingsPage.default_app_dirs()
      SettingsPage.config_home = SettingsPage.default_config_home()
      return bad
