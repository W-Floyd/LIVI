name: settings
# The settings page: LIVI's sections and rows from livi-ui-model, changed through the core as
# the stock UI changes them, a restart-only change behind Apply, and the shell's own look.
viewport: { width: 1920, height: 720 }
clock: 2026-11-09T08:30:00
fixtures:
  core: fixtures/parked.json
steps:
  - set: { core: { config: { darkMode: true, appearanceMode: auto, carName: LIVI, mainUiNightMode: false } } }
  - page: settings
  - tap: { node: Settings/Sections/List/Appearance }
  - expect_node: { path: Settings/Heading/Title, text: Appearance }
  - wait: { frames: 3 }
  # The shell's colours are its theme's (Look): LIVI's own UI Colors is not offered.
  - gdscript: |
      if not shell.has_node("Settings/Rows/List/Dark Mode") or shell.has_node("Settings/Rows/List/UI Colors"):
          return "Appearance rows: %s" % [shell.get_node("Settings/Rows/List").get_children().map(func(n): return n.name)]
  - screenshot: settings-appearance-day
  - tap: { node: Settings/Rows/List/Dark Mode }
  - expect_action: { SetConfig: { patch: { darkMode: false } } }
  - tap: { node: Settings/Rows/List/Phone Appearance/Box/Choice/Night }
  - expect_action: { SetConfig: { patch: { appearanceMode: night } } }
  # A list too long to set in place opens a page of its own; picking closes it.
  - tap: { node: Settings/Sections/List/General }
  - tap: { node: Settings/Rows/List/Start Page }
  - expect_node: { path: Settings/Heading/Title, text: Start Page }
  - tap: { node: Settings/Rows/List/Media }
  - expect_action: { SetConfig: { patch: { startPage: /media } } }
  - expect_node: { path: Settings/Heading/Title, text: General }
  # Live audio's backlog bounds, in ms: a page of steps each.
  - tap: { node: Settings/Sections/List/Audio }
  - gdscript: |
      var rows: DragScroll = shell.get_node("Settings/Rows")
      for row in ["Max Audio Lag", "Audio Lag After a Skip"]:
          if not rows.list.has_node(row):
              return "no %s row in %s" % [row, rows.list.get_children().map(func(n): return n.name)]
      rows.reveal(rows.list.get_node("Max Audio Lag"))
  - wait: { frames: 2 }
  - tap: { node: Settings/Rows/List/Max Audio Lag }
  - expect_node: { path: Settings/Heading/Title, text: Max Audio Lag }
  - gdscript: |
      for b in shell.get_node("Settings/Rows/List/Number").get_children():
          if b is Button and is_equal_approx(float(b.text), 100.0):
              b.pressed.emit()
              return
      return "no 100.0 step"
  - expect_action: { SetConfig: { patch: { audioBacklogMaxMs: 1100 } } }
  - tap: { node: Settings/Heading/Up }
  - gdscript: |
      var rows: DragScroll = shell.get_node("Settings/Rows")
      rows.reveal(rows.list.get_node("Audio Lag After a Skip"))
  - wait: { frames: 2 }
  - tap: { node: Settings/Rows/List/Audio Lag After a Skip }
  - expect_node: { path: Settings/Heading/Title, text: Audio Lag After a Skip }
  - gdscript: |
      for b in shell.get_node("Settings/Rows/List/Number").get_children():
          if b is Button and is_equal_approx(float(b.text), -100.0):
              b.pressed.emit()
              return
      return "no -100.0 step"
  - expect_action: { SetConfig: { patch: { audioBacklogTargetMs: 50 } } }
  - tap: { node: Settings/Heading/Up }
  - tap: { node: Settings/Sections/List/General }
  # A drag scrolls the list, and the row it ends on is not opened.
  - gdscript: |
      var rows: DragScroll = shell.get_node("Settings/Rows")
      var at: Vector2 = rows.get_global_rect().get_center() + Vector2(0, 150)
      var vp: Viewport = shell.get_viewport()
      var ev := InputEventMouseButton.new()
      ev.button_index = MOUSE_BUTTON_LEFT
      ev.position = at
      ev.pressed = true
      ev.button_mask = MOUSE_BUTTON_MASK_LEFT
      vp.push_input(ev)
      for i in 10:
          var m := InputEventMouseMotion.new()
          m.position = at - Vector2(0, 30 * (i + 1))
          m.button_mask = MOUSE_BUTTON_MASK_LEFT
          vp.push_input(m)
          await runner.frames(1)
      var up := ev.duplicate()
      up.position = at - Vector2(0, 300)
      up.pressed = false
      up.button_mask = 0
      vp.push_input(up)
      await runner.frames(2)
      if rows.offset <= 0.0:
          return "the list did not scroll"
      if shell.get_node("Settings/Heading/Title").text != "General":
          return "the drag opened a row"
  # A restart-only setting changed while a phone is connected waits for Apply.
  - set: { core: { sessions: { total: 1 } } }
  - wait: { frames: 20 }
  - set: { core: { config: { carName: Kia } } }
  - wait: { frames: 20 }
  - expect_node: { path: Settings/Header/Apply, visible: true }
  - tap: { node: Settings/Header/Apply }
  - expect_action: { ApplySettings: null }
  - expect_node: { path: Settings/Header/Apply, visible: false }
  # The shell's look: set at once, and Day or Night holds against the core's night mode.
  - tap: { node: Settings/Sections/List/Look }
  - tap: { node: Settings/Rows/List/Day or night/Box/Choice/Night }
  - set: { core: { config: { mainUiNightMode: false } } }
  - wait: { frames: 20 }
  - tap: { node: Settings/Rows/List/Steering wheel/Box/Choice/Right }
  - gdscript: |
      if ThemeManager.appearance != "night" or ThemeManager.appearance_mode != "night":
          return "appearance %s, mode %s" % [ThemeManager.appearance, ThemeManager.appearance_mode]
      if ThemeManager.hand != "rhd":
          return "hand %s" % ThemeManager.hand
  - wait: { frames: 3 }
  - screenshot: settings-look-night
  - gdscript: |
      var rows: DragScroll = shell.get_node("Settings/Rows")
      rows.reveal(rows.list.get_node("Swipe home"))
  - wait: { frames: 2 }
  # Five options: a page of its own.
  - tap: { node: Settings/Rows/List/Swipe home }
  - tap: { node: Settings/Rows/List/Bottom }
  - gdscript: |
      if ThemeManager.home_swipe != "bottom":
          return "swipe home %s" % ThemeManager.home_swipe
      ThemeManager.set_look({home_swipe = "off"})
      var rows: DragScroll = shell.get_node("Settings/Rows")
      rows.reveal(rows.list.get_node("Day or night"))
  - wait: { frames: 2 }
  - tap: { node: Settings/Rows/List/Day or night/Box/Choice/Auto }
  - gdscript: |
      if ThemeManager.appearance != "day":
          return "auto does not follow the core's day"
      ThemeManager.set_look({appearance = "night"})
      if ThemeManager.appearance != "day":
          return "auto keeps an appearance set directly (%s), not the core's day" % ThemeManager.appearance
  - tap: { node: Settings/Header/Back }
  - wait: { frames: 2 }
  - expect_node: { path: Page/Body, visible: true }
  # Battery preconditioning: automatic on a route, as the car link reports it, and its threshold.
  - set: { core: { telemetry: { preconditionState: armed, preconditionWhy: "the charger is 11 kW, not above 50" } } }
  - page: settings
  - tap: { node: Settings/Sections/List/Car }
  - gdscript: |
      var rows: DragScroll = shell.get_node("Settings/Rows")
      if not rows.list.has_node("Battery Preconditioning"):
          return "no Battery Preconditioning in %s" % [rows.list.get_children().map(func(n): return n.name)]
      rows.reveal(rows.list.get_node("Battery Preconditioning"))
  - wait: { frames: 2 }
  - tap: { node: Settings/Rows/List/Battery Preconditioning }
  - expect_node: { path: Settings/Heading/Title, text: Battery Preconditioning }
  - gdscript: |
      var names = shell.get_node("Settings/Rows").list.get_children().map(func(n): return n.name)
      for row in ["On a Route to a Fast Charger", "Automatic_ Chargers Above"]:
          if not row in names:
              return "no %s in %s" % [row, names]
  - wait: { frames: 3 }
  - screenshot: settings-preconditioning
  # Reboot: parked only, whatever the lockout mode, and asked again before it acts.
  - set: { core: { telemetry: { drivingRegulation: true } } }
  # Below the sections' fold.
  - gdscript: |
      shell.get_node("Settings/Sections/List/System").pressed.emit()
  - expect_node: { path: Settings/Heading/Title, text: System }
  - tap: { node: Settings/Rows/List/Reboot }
  - tap: { node: Settings/Rows/List/Reboot }
  - gdscript: |
      var row: Control = shell.get_node("Settings/Rows/List/Reboot")
      if row.mouse_filter != Control.MOUSE_FILTER_IGNORE or row.modulate.a >= 1.0:
          return "Reboot is not greyed while driving"
      if Core.fake_sent().any(func(m): return m.get("type") == "action" and m.action.get("kind") == "reboot"):
          return "Reboot acted while driving"
  - set: { core: { telemetry: { drivingRegulation: false } } }
  # Parked has to hold before the lockout lifts.
  - gdscript: |
      for i in 600:
          if not Drive.moving:
              break
          await runner.frames(1)
      if Drive.moving:
          return "still driving"
      await runner.frames(2)
  - tap: { node: Settings/Rows/List/Reboot }
  - expect_node: { path: Settings/Rows/List/Tap again_ Reboot, visible: true }
  - gdscript: |
      if Core.fake_sent().any(func(m): return m.get("type") == "action" and m.action.get("kind") == "reboot"):
          return "Reboot acted on the first tap"
  - tap: { node: Settings/Rows/List/Tap again_ Reboot }
  - expect_action: { Reboot: null }
