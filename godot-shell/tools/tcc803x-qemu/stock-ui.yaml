# The stock UI (EV6, V015) as a graph, for drive.py --flow: screens, how to tell each is up, and the
# transitions between them. Coordinates are the 1920x720 panel's. A screen's state is the car the fake
# micom (and the GNSS fake) play while it is driven there (states:). Screenshots go outside the repo
# (vendor UI).
#
# expect: activity (the focused window, `dumpsys window windows`), ids (views shown, `dumpsys activity
# top`: app:id/<name> with visibility V; a parent's is not checked), dialog (true: a dialog window over the activity, so ids are not
# checked). A transition's do: is a list of {tap: [x, y]}, {tap_id: name}, {key: BACK|HOME|<code>},
# {shell: "..."} and {wait: seconds}.

start: home   # what the snapshot shows (README "Stock UI flows")

states:
  # Parked, IGN on, nothing scheduled: the values stock's EV settings show, by the variant's names.
  parked:
    still: 30s   # with MICOM_CAPTURE: the capture's state at 30 s, then the scenario over it
    scenario:
      - { msg: "Boot record (full)", set: { ACC: true, IGN1: true, IGN3: true, "CAN DB generation": 2, "Driving regulation": false } }
      - { msg: "VCU ready", set: { "VCU ready": true } }
      - { msg: "Charge limit, AC", set: { "Charge limit, AC": 80 } }
      - { msg: "Charge limit, DC", set: { "Charge limit, DC": 90 } }
      - { msg: "AC charging current", set: { "AC charging current": maximum } }
      - { msg: "Battery conditioning mode", set: { "Battery conditioning mode": "off" } }
      # Not driving: in North America the EV app refuses its schedule dialogs under the driving
      # regulation (SYS_REGULATOIN_STATUS_M 0x8103, a signal, so a raw frame).
      - { msg: "Regulation inputs", set: { "In P": true, "Parking brake lever": true, "EPB state": 1 } }
      - { frame: "ff 01 8a 01 81 03 00 02 00 f5" }
    # The GNSS time (HIPPO_FAKE): the main page's departure and schedule tiles are enabled only once the
    # system's time is real (TimePolicyManager.isRealTimeSet: GPS, NITZ or an RTC board); the snapshot keeps it.
    gps: { point: "33.6846,-117.8265" }
  # Departure 1 07:30 Mon Wed on, as the car reports it (the schedule tile needs a departure).
  departure-set:
    still: 30s
    gps: { point: "33.6846,-117.8265" }
    scenario:
      - { msg: "Boot record (full)", set: { ACC: true, IGN1: true, IGN3: true, "CAN DB generation": 2, "Driving regulation": false } }
      - { msg: "VCU ready", set: { "VCU ready": true } }
      - { msg: "Regulation inputs", set: { "In P": true, "Parking brake lever": true, "EPB state": 1 } }
      - { frame: "ff 01 8a 01 81 03 00 02 00 f5" }
      - { msg: "Departure timers", set: { "Departure 1 hour": 7, "Departure 1 minute bits": 3, "Departure 2 hour": 31, "Departure 2 minute bits": 7 } }
      - { msg: "Departure days", set: { "Departure 1 Monday": 1, "Departure 1 Wednesday": 1, "Departure 1 enabled": 1 } }

screens:
  home:
    expect: { activity: "com.android.launcher3/.*Launcher" }
  ev-main:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity", ids: [mainview_settings_layout_widget] }
  ev-menu:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity", dialog: true }
  ev-energy-information:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity" }
  ev-settings:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*EvSettingActivity", ids: [ev_settings_utilitymode_button] }
  ev-settings-charge-limit:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*EvSettingActivity", ids: [eco_evsettings_maxcharge_view_layout] }
  ev-settings-charge-limit-dc:   # the DC limit's picker open (the check cannot tell it from closed)
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*EvSettingActivity", ids: [eco_evsettings_maxcharge_view_layout] }
  ev-settings-ac-current:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*EvSettingActivity", ids: [eco_evsettings_chargingcurrent_new_view_layout] }
  ev-settings-battery-conditioning:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*EvSettingActivity", ids: [eco_evsettings_battery_cond_checkbox] }
  ev-settings-utility-mode:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*EvSettingActivity", ids: [eco_evsettings_utilitymode_view_layout] }
  ev-next-departure:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity" }
  ev-departure-dialog:
    state: parked
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity", dialog: true }
  ev-next-departure-set:
    state: departure-set
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity" }
  ev-scheduled:
    state: departure-set
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity" }
  ev-off-peak-dialog:
    state: departure-set
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity", dialog: true }
  ev-climate-dialog:
    state: departure-set
    expect: { activity: "com.hkmc.daudio.app.ev3/.*MainActivity", dialog: true }

transitions:
  - { from: home, to: ev-main, do: [{ shell: "am start -n com.hkmc.daudio.app.ev3/.MainActivity" }, { wait: 8 }] }
  - { from: ev-main, to: ev-menu, do: [{ tap: [331, 44] }, { wait: 4 }] }
  - { from: ev-menu, to: ev-energy-information, do: [{ tap: [239, 248] }, { wait: 5 }] }
  - { from: ev-main, to: ev-settings, do: [{ tap: [1207, 655] }, { wait: 6 }] }
  - { from: ev-settings, to: ev-settings-charge-limit, do: [{ tap: [160, 234] }, { wait: 4 }] }
  - { from: ev-settings-charge-limit, to: ev-settings-charge-limit-dc, do: [{ tap: [1228, 234] }, { wait: 4 }] }
  - { from: ev-settings, to: ev-settings-ac-current, do: [{ tap: [135, 348] }, { wait: 4 }] }
  - { from: ev-settings, to: ev-settings-battery-conditioning, do: [{ tap: [140, 495] }, { wait: 4 }] }
  - { from: ev-settings, to: ev-settings-utility-mode, do: [{ tap: [138, 637] }, { wait: 4 }] }
  - { from: ev-main, to: ev-next-departure, do: [{ tap: [290, 660] }, { wait: 6 }] }
  - { from: ev-next-departure, to: ev-departure-dialog, do: [{ tap: [1203, 260] }, { wait: 6 }] }
  - { from: ev-main, to: ev-next-departure-set, do: [{ tap: [290, 660] }, { wait: 6 }] }
  - { from: ev-main, to: ev-scheduled, do: [{ tap: [845, 660] }, { wait: 6 }] }
  - { from: ev-scheduled, to: ev-off-peak-dialog, do: [{ tap: [1202, 234] }, { wait: 6 }] }
  - { from: ev-scheduled, to: ev-climate-dialog, do: [{ tap: [1202, 344] }, { wait: 6 }] }

# Declared, not reached, and why.
unreachable:
  ev-charging-station-list: "needs the navigation, which stays on its start screen (no map data in the image)"
  navigation: "stays on its start screen (no map data in the image)"
  launcher-apps: "the rest of the launcher's tree is not mapped yet"
